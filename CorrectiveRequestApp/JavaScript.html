function debounce(fn, delay) {
 let timer = null;
 return function() {
  const ctx = this;
  const args = arguments;
  clearTimeout(timer);
  timer = setTimeout(function() { fn.apply(ctx, args); }, delay);
 };
}

function syncModalState(modal) {
 if (!modal || !modal.id) return;
 const isVisible = modal.style.display && modal.style.display !== 'none';
 const idx = _modalStack.indexOf(modal.id);
 if (isVisible) {
  if (idx === -1) {
   try {
    if (document.activeElement && !modal.contains(document.activeElement)) {
     modal._prevFocus = document.activeElement;
    }
   } catch(e) {}
   _modalStack.push(modal.id);
  } else if (idx !== _modalStack.length - 1) {
   _modalStack.splice(idx, 1);
   _modalStack.push(modal.id);
  }
 } else if (idx !== -1) {
  _modalStack.splice(idx, 1);
  if (_modalStack.length === 0 && modal._prevFocus && typeof modal._prevFocus.focus === 'function' && document.body.contains(modal._prevFocus)) {
   const targetFocus = modal._prevFocus;
   modal._prevFocus = null;
   setTimeout(function() { try { targetFocus.focus(); } catch(e) {} }, 20);
  }
 }
 const anyOpen = _modalStack.length > 0;
 document.body.classList.toggle('modal-open', anyOpen);
 if (anyOpen) {

  closeAdminToolsMenu();
 }
}

    }
   });

 }

function openRowMoreMenu(triggerBtn, items) {

  menu = document.createElement('div');
  menu.id = 'floatingRowMoreMenu';
  menu.className = 'row-more-menu';
  menu.setAttribute('role', 'menu');
  document.body.appendChild(menu);
 }
 const alreadyThis = menu.classList.contains('open') && menu._trigger === triggerBtn;
 if (alreadyThis) {
  closeFloatingRowMoreMenu();
  return;
 }
 _rowMoreActions = items;
 menu._trigger = triggerBtn;
 menu.innerHTML = items.map(function(it, idx) {
  return '<button type="button" class="row-more-item' + (it.danger ? ' is-danger' : '') + '" role="menuitem" onclick="executeRowMoreAction(' + idx + ')">' +
   '<i class="' + escapeAttr(it.icon || 'fas fa-ellipsis-h') + '"></i><span>' + escapeHtml(it.label || '') + '</span></button>';
 }).join('');
 menu.classList.add('open');
 const rect = triggerBtn.getBoundingClientRect();
 const menuW = menu.offsetWidth || 215;
 const menuH = menu.offsetHeight || (items.length * 38 + 12);
 let left = Math.max(8, Math.min(rect.right - menuW, window.innerWidth - menuW - 8));
 let top = rect.bottom + 6;
 if (top + menuH > window.innerHeight - 10) {
  top = Math.max(8, rect.top - menuH - 6);
 }
 menu.style.left = Math.round(left) + 'px';
 menu.style.top = Math.round(top) + 'px';
}

}

function formatNowHHMM() {

}

   localStorage.setItem(getDraftStorageKey('pm', id), JSON.stringify(payload));

 } catch (e) {}

function clearLocalDraft(kind, targetId) {
 try {
  localStorage.removeItem(getDraftStorageKey(kind, targetId));
 } catch (e) {}
 _formDirty[kind] = false;
 if (kind === 'cm') setDraftBadge('formDraftBadge', '', false);
 else if (kind === 'tech') setDraftBadge('techDraftBadge', '', false);
 else if (kind === 'pm') setDraftBadge('pmTcDraftBadge', '', false);
}
function readLocalDraft(kind, targetId) {
 try {
  const raw = localStorage.getItem(getDraftStorageKey(kind, targetId));
  if (!raw) return null;
  const obj = JSON.parse(raw);
  if (!obj || !obj.savedAt || (Date.now() - obj.savedAt) > 7 * 24 * 60 * 60 * 1000) {
   localStorage.removeItem(getDraftStorageKey(kind, targetId));
   return null;
  }
  return obj;
 } catch (e) { return null; }
}

function refreshTechDropdowns() {

function populateDynamicYearSelects() {

  const dStr = (r.InformDate || r.TargetDate || r.DueDate || '').toString().trim();
  const m = dStr.match(/\b(20\d{2})\b/);
  if (m) {

  }

  { id: 'pmYearFilter', includeAll: true, defaultYear: String(nowYear) },
  { id: 'pmImportYear', includeAll: false, defaultYear: String(nowYear) },
  { id: 'pmWeeklyYearSelect', includeAll: false, defaultYear: String(nowYear) },
  { id: 'restoreWoYear', includeAll: false, defaultYear: String(nowYear) }
 ];
 selectConfigs.forEach(function(cfg) {
  const sel = document.getElementById(cfg.id);

const PM_PDF_IDB_NAME = 'ThaiLionAirPmPdfBinaryDB';
const PM_PDF_IDB_STORE = 'pdfBinaryStore';
function openPmPdfIndexedDB() {
 return new Promise(function(resolve) {
  if (typeof indexedDB === 'undefined') return resolve(null);
  try {
   const req = indexedDB.open(PM_PDF_IDB_NAME, 1);
   req.onupgradeneeded = function(e) {
    const db = e.target.result;
    if (!db.objectStoreNames.contains(PM_PDF_IDB_STORE)) {
     db.createObjectStore(PM_PDF_IDB_STORE);
    }
   };
   req.onsuccess = function(e) { resolve(e.target.result); };
   req.onerror = function() { resolve(null); };
  } catch (err) {
   resolve(null);
  }
 });
}
async function getCachedPmPdfBinary(tplKey) {

  return window._pmPdfBytesCache[tplKey];
 }
 const db = await openPmPdfIndexedDB();
 if (!db) return null;
 return new Promise(function(resolve) {
  try {
   const tx = db.transaction(PM_PDF_IDB_STORE, 'readonly');
   const store = tx.objectStore(PM_PDF_IDB_STORE);
   const getReq = store.get(tplKey);
   getReq.onsuccess = function() {
    if (getReq.result && getReq.result.uint8 && getReq.result.uint8.byteLength > 500) {
     window._pmPdfBytesCache[tplKey] = getReq.result;
     resolve(getReq.result);
    } else {
     resolve(null);
    }
   };
   getReq.onerror = function() { resolve(null); };
  } catch (e) {
   resolve(null);
  }
 });
}

async function extractChecklistYFromPdfPage(page, canvas) {
 try {
  const vp1 = page.getViewport({ scale: 1.0 });
  const pageH = vp1.height || 841.89;
  const textContent = await page.getTextContent();
  const items = textContent.items || [];
  if (canvas && canvas.width > 0 && canvas.height > 0) {
   const w = canvas.width;
   const h = canvas.height;
   const ctx = canvas.getContext('2d');
   const imgData = ctx.getImageData(0, 0, w, h).data;
   function isDarkPx(x, y) {
    if (x < 0 || x >= w || y < 0 || y >= h) return false;
    const idx = (y * w + x) * 4;
    return (imgData[idx] + imgData[idx + 1] + imgData[idx + 2]) / 3 < 195;
   }
   const xProbeStart = Math.floor(w * 0.82);
   const xProbeEnd = Math.floor(w * 0.89);
   const probeW = xProbeEnd - xProbeStart;
   const yStart = Math.floor(h * 0.125);
   const yEnd = Math.floor(h * 0.95);
   const hLineYs = [];
   for (let y = yStart; y <= yEnd; y++) {
    let darkCount = 0;
    for (let x = xProbeStart; x <= xProbeEnd; x++) {
     if (isDarkPx(x, y)) darkCount++;
    }
    if (darkCount >= probeW * 0.75) {
     hLineYs.push(y);
    }
   }
   const hClusters = [];
   const clusterGap = Math.max(3, Math.round(h * 0.0022));
   for (let i = 0; i < hLineYs.length; i++) {
    const y = hLineYs[i];
    if (!hClusters.length || y - hClusters[hClusters.length - 1].maxY > clusterGap) {
     hClusters.push({ minY: y, maxY: y });
    } else {
     hClusters[hClusters.length - 1].maxY = y;
    }
   }
   const rowBordersY = hClusters.map(function(c) { return Math.round((c.minY + c.maxY) / 2); });
   const cells = [];
   for (let i = 0; i < rowBordersY.length - 1; i++) {
    const yTopPx = rowBordersY[i];
    const yBotPx = rowBordersY[i + 1];
    const cellHPct = ((yBotPx - yTopPx) / h) * 100;
    if (cellHPct >= 1.2 && cellHPct <= 15.0) {
     cells.push({
      topPx: yTopPx,
      botPx: yBotPx,
      topPct: (yTopPx / h) * 100,
      botPct: (yBotPx / h) * 100,
      cyPct: (((yTopPx + yBotPx) / 2) / h) * 100
     });
    }
   }
   if (cells.length > 0) {
    const tableTopY = cells[0].topPx;
    const tableBotY = cells[cells.length - 1].botPx;
    const tableH = tableBotY - tableTopY;
    let cxPct = 85.9;
    if (tableH > 20) {
     const vLineXs = [];
     for (let x = Math.floor(w * 0.70); x <= Math.floor(w * 0.97); x++) {

      } else {

      const perfLeftX = colBordersX[colBordersX.length - 2];
      const candCx = (((perfLeftX + perfRightX) / 2) / w) * 100;

      }
     }
    }
    const descWords = [];
    items.forEach(function(ti) {

   }
  }

  const sep = clean.indexOf('\t') !== -1 ? '\t' : (clean.indexOf(',') !== -1 ? ',' : (clean.indexOf(';') !== -1 ? ';' : '|'));
  const parts = clean.split(sep).map(function(p) { return p.trim(); }).filter(function(p, i) { return i < 2 || p !== ''; });

  if (parts.length >= 3) {
   const maybeRole = normalizeParsedRole(parts[2], null);
   if (maybeRole) {
    role = maybeRole;
    customRole = true;
    dept = parts[3] || getDefaultDepartmentForRole(role);
    if (parts[3]) customDept = true;
    tel = parts[4] || '';
   } else {
    dept = parts[2] || defs.department;
    customDept = true;
    tel = parts[3] || '';
   }
  }
  return {
   employeeId: empId,
   fullName: fullName,
   role: role,
   department: dept,
   tel: tel,
   _customRole: customRole,
   _customDept: customDept
  };
 }

 if (match) {

   employeeId: empId,
   fullName: rest,
   role: defs.role,

   _customDept: false
  };
 }

function updateUmBulkRowField(idx, field, val, inputEl) {

  let cleanId = (val || '').toUpperCase().replace(/\s+/g, '');
  if (cleanId.length > 8) cleanId = cleanId.substring(0, 8);
  umBulkRows[idx].employeeId = cleanId;
  if (inputEl && inputEl.value !== cleanId) inputEl.value = cleanId;
 } else if (field === 'fullName') {
  umBulkRows[idx].fullName = val;
 } else if (field === 'role') {
  umBulkRows[idx].role = val;
  umBulkRows[idx]._customRole = true;
  if (!umBulkRows[idx]._customDept) {
   umBulkRows[idx].department = getDefaultDepartmentForRole(val);
   const deptInp = document.getElementById('umBulkDept_' + idx);
   if (deptInp) deptInp.value = umBulkRows[idx].department;

  umBulkRows[idx].department = val;

}

 const banner = document.getElementById('appUpdateBanner');
 if (banner) banner.style.display = 'none';
 appUpdateDismissedVersion = (latestServerVersionInfo && latestServerVersionInfo.version) || '';
 appUpdateDismissedUntil = Date.now() + (10 * 60 * 1000); // ซ่อนชั่วคราว 10 นาที
}
function reloadAppToLatestVersion() {
 try { localStorage.removeItem('cached_dashboard_data'); } catch (e) {}
 try { sessionStorage.removeItem('cached_pdf_template_css'); } catch (e) {}
 showToast('กำลังล้างแคชและอัปเดตหน้าเว็บเป็นเวอร์ชันล่าสุด...', 'info');
 const serverUrl = (latestServerVersionInfo && latestServerVersionInfo.appUrl)
  || (window.CLIENT_APP_VERSION_INFO && window.CLIENT_APP_VERSION_INFO.appUrl)
  || '';
 const targetVer = (latestServerVersionInfo && latestServerVersionInfo.version) || '';
 if (serverUrl) {
  const sep = serverUrl.indexOf('?') === -1 ? '?' : '&';
  const bustUrl = serverUrl + sep + 'v=' + encodeURIComponent(targetVer || Date.now()) + '&t=' + Date.now();
  try {
   window.top.location.href = bustUrl;
   return;
  } catch (e1) {
   try {
    window.open(bustUrl, '_top');
    return;
   } catch (e2) {}
  }
 }
 try {
  window.location.reload(true);
 } catch (e3) {
  window.location.reload();
 }
}
function checkAndShowWhatsNewOnLogin() {
 if (hasCheckedWhatsNewThisSession) return;
 hasCheckedWhatsNewThisSession = true;
 if (!currentUser || !currentUser.employeeId) return;
 let seenVer = '';
 try {
  seenVer = localStorage.getItem('seen_app_version') || '';
 } catch (e) {}
 if (seenVer === CLIENT_APP_VERSION) return;
 if (latestServerVersionInfo && latestServerVersionInfo.version && latestServerVersionInfo.version !== CLIENT_APP_VERSION) {
  return;
 }
 openWhatsNewModal(false);
}
function openWhatsNewModal(isManualClick) {
 const modal = document.getElementById('appWhatsNewModal');
 if (!modal) return;
 const rawInfo = (isManualClick && latestServerVersionInfo && latestServerVersionInfo.version === CLIENT_APP_VERSION)
  ? latestServerVersionInfo
  : (window.CLIENT_APP_VERSION_INFO || latestServerVersionInfo || { version: CLIENT_APP_VERSION });
 const info = getEffectiveVersionInfoForCurrentUser(rawInfo);
 const titleEl = document.getElementById('whatsNewTitle');
 const pillEl = document.getElementById('whatsNewVersionPill');
 const dateEl = document.getElementById('whatsNewDate');
 const sumEl = document.getElementById('whatsNewSummary');
 const listEl = document.getElementById('whatsNewHighlightsList');
 if (titleEl) titleEl.textContent = info.title || ('อัปเดตระบบเป็น ' + (info.version || CLIENT_APP_VERSION));
 if (pillEl) pillEl.textContent = info.version || CLIENT_APP_VERSION;
 if (dateEl) dateEl.textContent = info.releaseDate ? ('เผยแพร่เมื่อ: ' + info.releaseDate) : '';
 if (sumEl) sumEl.textContent = info.summary || 'รายละเอียดการปรับปรุงล่าสุดของระบบใบแจ้งซ่อมและแผน PM';
 if (listEl) {
  listEl.innerHTML = '';
  const items = Array.isArray(info.highlights) && info.highlights.length > 0
   ? info.highlights
   : ['ปรับปรุงความเสถียรและประสิทธิภาพการทำงานของระบบ'];
  items.forEach(function(text) {
   const li = document.createElement('li');
   li.textContent = text;
   listEl.appendChild(li);
  });
 }
 modal.style.display = 'flex';
}
function closeWhatsNewModal() {
 const modal = document.getElementById('appWhatsNewModal');
 if (modal) modal.style.display = 'none';
 try {
  localStorage.setItem('seen_app_version', CLIENT_APP_VERSION);
 } catch (e) {}
}
</script>
