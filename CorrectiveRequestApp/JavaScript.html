/**
 * ค้นหาข้อมูลอุปกรณ์ใน GSE MASTER ตามรหัส (Normalized เพื่อความยืดหยุ่น)
 * @param {string} equipmentCode
 * @returns {Object|null}
 */
function findEquipmentInMaster(equipmentCode) {
  if (!equipmentCode) return null;
  const norm = equipmentCode.toString().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!norm) return null;
  const list = (typeof equipmentMasterList !== 'undefined' && Array.isArray(equipmentMasterList)) ? equipmentMasterList : [];
  for (let i = 0; i < list.length; i++) {
    const itemNorm = (list[i].gseNo || '').toString().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (norm === itemNorm) {
      return list[i];
    }
  }
  return null;
}

function isEquipmentInactive(code) {
  if (!code) return false;
  const norm = code.toString().toUpperCase().replace(/[^A-Z0-9]/g, '');

  // 1. ตรวจจาก equipmentMasterList ที่ดึงสดจากชีต Emro Status ก่อนเป็นหลัก
  if (equipmentMasterList && equipmentMasterList.length > 0) {
    for (let i = 0; i < equipmentMasterList.length; i++) {
      const itemNorm = (equipmentMasterList[i].gseNo || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (norm === itemNorm) {
        return !!equipmentMasterList[i].isInactive;
      }
    }
  }

  // 2. Fallback: รายการคงที่เดิม
  for (let i = 0; i < INACTIVE_EQUIPMENTS.length; i++) {
    if (norm === INACTIVE_EQUIPMENTS[i].replace(/[^A-Z0-9]/g, '')) return true;
  }
  return false;
}

/**
 * โหลด equipment list จาก server (พร้อมตัวเลือกรีเฟรชสด)
 */
function loadEquipmentMaster(callback, forceRefresh) {
  if (equipmentMasterList !== null && !forceRefresh) {
    if (callback) callback();
    return;
  }
  google.script.run
    .withSuccessHandler(function(list) {
      equipmentMasterList = list || [];
      if (callback) callback();
    })
    .withFailureHandler(function() {
      equipmentMasterList = equipmentMasterList || [];
      if (callback) callback();
    })
    .getEquipmentList(!!forceRefresh);
}

/**
 * escape ค่า string สำหรับใส่ใน HTML attribute (ป้องกัน double-quote พัง และรองรับ number/null ปลอดภัย 100%)
 */
function escapeAttr(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/**
 * เมื่อ user พิมพ์ในช่อง Equipment Code → filter และแสดง dropdown
 */
function onEquipmentCodeInput(val) {
  const query = val.trim().toUpperCase();
  const dropdown = document.getElementById('equipmentDropdown');
  const warnEl = document.getElementById('equipmentInactiveWarning');
  const codeInput = document.getElementById('fEquipmentCode');

  // ล้างสถานะกรอบสีแดงเมื่อผู้ใช้เริ่มพิมพ์แก้ไข
  if (codeInput) {
    codeInput.style.borderColor = '';
    codeInput.style.boxShadow = '';
  }

  // ตรวจสอบเบื้องต้น: ถ้ารหัสตรงกับ Inactive ในระบบ ให้เตือน
  if (isEquipmentInactive(val)) {
    if (warnEl) {
      warnEl.innerHTML = '<i class="fas fa-ban"></i> รหัสอุปกรณ์ <strong>' + escapeHtml(val.trim().toUpperCase()) + '</strong> มีสถานะ Inactive ไม่สามารถแจ้งซ่อมได้';
      warnEl.style.display = 'flex';
    }
  } else {
    // ถ้ากำลังพิมพ์แก้ไขและยังไม่ตรง ให้ซ่อนคำเตือนชั่วคราว
    if (warnEl) warnEl.style.display = 'none';
  }

  if (!query) {
    const nameEl = document.getElementById('fEquipmentName');
    if (nameEl) nameEl.value = '';
    dropdown.style.display = 'none';
    return;
  }
  if (query.length < 2) {
    dropdown.style.display = 'none';
    return;
  }

  if (equipmentMasterList === null) {
    dropdown.innerHTML = '<div class="equipment-dropdown-empty">กำลังโหลดข้อมูลอุปกรณ์...</div>';
    dropdown.style.display = 'block';
    loadEquipmentMaster(function() {
      onEquipmentCodeInput(val); // re-run after loaded
    });
    return;
  }

  // filter
  const filtered = equipmentMasterList.filter(function(item) {
    return item.gseNo.toUpperCase().indexOf(query) !== -1 ||
           item.description.toUpperCase().indexOf(query) !== -1;
  }).slice(0, 15); // แสดงสูงสุด 15 รายการ

  if (filtered.length === 0) {
    dropdown.innerHTML = '<div class="equipment-dropdown-empty"><i class="fas fa-exclamation-circle"></i> ไม่พบรหัสอุปกรณ์นี้ใน sheet GSE MASTER</div>';
    dropdown.style.display = 'block';
    return;
  }

  // ใช้ data-gse / data-desc / data-inactive
  dropdown.innerHTML = filtered.map(function(item) {
    const isInactive = isEquipmentInactive(item.gseNo) || item.isInactive;
    const codeHl = highlightMatch(escapeHtml(item.gseNo), query);
    const descHl = highlightMatch(escapeHtml(item.description), query);

    if (isInactive) {
      return '<div class="equipment-dropdown-item item-inactive" ' +
             'data-gse="' + escapeAttr(item.gseNo) + '" ' +
             'data-desc="' + escapeAttr(item.description) + '" ' +
             'data-inactive="true" ' +
             'onmousedown="selectEquipmentFromEl(this)">' +
             '<div class="eq-header-row">' +
             '  <div class="eq-code" style="color:#64748B;">' + codeHl + '</div>' +
             '  <span class="badge-inactive"><i class="fas fa-ban"></i> INACTIVE</span>' +
             '</div>' +
             '<div class="eq-desc" style="color:#94A3B8;">' + descHl + '</div>' +
             '<div class="eq-inactive-note"><i class="fas fa-exclamation-triangle"></i> อุปกรณ์นี้มีสถานะ Inactive ไม่สามารถแจ้งซ่อมได้</div>' +
             '</div>';
    }

    return '<div class="equipment-dropdown-item" ' +
           'data-gse="' + escapeAttr(item.gseNo) + '" ' +
           'data-desc="' + escapeAttr(item.description) + '" ' +
           'data-inactive="false" ' +
           'onmousedown="selectEquipmentFromEl(this)">' +
           '<div class="eq-code">' + codeHl + '</div>' +
           '<div class="eq-desc">' + descHl + '</div>' +
           '</div>';
  }).join('');
  dropdown.style.display = 'block';
}

/**
 * อ่านค่าจาก data attribute แล้วส่งไปกรอกฟอร์ม
 */
function selectEquipmentFromEl(el) {
  var isInactive = el.getAttribute('data-inactive') === 'true';
  var gseNo = el.getAttribute('data-gse');
  var desc  = el.getAttribute('data-desc');
  var warnEl = document.getElementById('equipmentInactiveWarning');
  var codeInput = document.getElementById('fEquipmentCode');

  if (isInactive) {
    showToast('อุปกรณ์ ' + gseNo + ' มีสถานะ Inactive ไม่สามารถแจ้งซ่อมได้', 'error');
    if (warnEl) {
      warnEl.innerHTML = '<i class="fas fa-ban"></i> รหัสอุปกรณ์ <strong>' + escapeHtml(gseNo) + '</strong> มีสถานะ Inactive ไม่สามารถแจ้งซ่อมได้';
      warnEl.style.display = 'flex';
    }
    if (codeInput) {
      codeInput.value = gseNo;
      codeInput.focus();
    }
    document.getElementById('equipmentDropdown').style.display = 'none';
    return;
  }

  if (warnEl) warnEl.style.display = 'none';
  selectEquipment(gseNo, desc);
}

/**
 * highlight คำที่ค้นหาใน string
 */
function highlightMatch(str, query) {
  const idx = str.toUpperCase().indexOf(query);
  if (idx === -1) return str;
  return str.substring(0, idx) +
         '<mark style="background:#fff176;padding:0;">' + str.substring(idx, idx + query.length) + '</mark>' +
         str.substring(idx + query.length);
}

/**
 * เมื่อ user เลือกอุปกรณ์จาก dropdown
 */
function selectEquipment(gseNo, description) {
  const codeInput = document.getElementById('fEquipmentCode');
  const nameInput = document.getElementById('fEquipmentName');
  if (codeInput) {
    codeInput.value = gseNo;
    codeInput.style.borderColor = '';
    codeInput.style.boxShadow = '';
  }
  if (nameInput) nameInput.value = description;
  document.getElementById('equipmentDropdown').style.display = 'none';
  const warnEl = document.getElementById('equipmentInactiveWarning');
  if (warnEl) warnEl.style.display = 'none';
}

/**
 * ซ่อน dropdown เมื่อ blur และตรวจสอบว่ารหัสอุปกรณ์มีใน sheet GSE MASTER หรือไม่
 */
function onEquipmentCodeBlur() {
  setTimeout(function() {
    const dropdown = document.getElementById('equipmentDropdown');
    if (dropdown) dropdown.style.display = 'none';

    const codeInput = document.getElementById('fEquipmentCode');
    const nameInput = document.getElementById('fEquipmentName');
    const warnEl = document.getElementById('equipmentInactiveWarning');
    const code = codeInput ? codeInput.value.trim() : '';

    if (!code) {
      if (nameInput) nameInput.value = '';
      if (warnEl) warnEl.style.display = 'none';
      if (codeInput) {
        codeInput.style.borderColor = '';
        codeInput.style.boxShadow = '';
      }
      return;
    }

    if (equipmentMasterList === null) {
      loadEquipmentMaster(function() {
        onEquipmentCodeBlur();
      });
      return;
    }

    const match = findEquipmentInMaster(code);
    if (match) {
      // มีในระบบ GSE MASTER
      codeInput.value = match.gseNo;
      if (nameInput) nameInput.value = match.description || '';
      codeInput.style.borderColor = '';
      codeInput.style.boxShadow = '';

      const isInactive = isEquipmentInactive(match.gseNo) || match.isInactive;
      if (isInactive) {
        if (warnEl) {
          warnEl.innerHTML = '<i class="fas fa-ban"></i> รหัสอุปกรณ์ <strong>' + escapeHtml(match.gseNo) + '</strong> มีสถานะ Inactive ไม่สามารถแจ้งซ่อมได้';
          warnEl.style.display = 'flex';
        }
      } else {
        if (warnEl) warnEl.style.display = 'none';
      }
    } else {
      // ไม่มีในระบบ GSE MASTER
      if (nameInput) nameInput.value = '';
      if (codeInput) {
        codeInput.style.borderColor = '#EF4444';
        codeInput.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.15)';
      }
      if (warnEl) {
        warnEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i> รหัสอุปกรณ์ <strong>' + escapeHtml(code) + '</strong> ไม่มีในระบบ ไม่สามารถแจ้งซ่อมอุปกรณ์ดังกล่าวได้';
        warnEl.style.display = 'flex';
      }
      showToast('ไม่มีในระบบ ไม่สามารถแจ้งซ่อมอุปกรณ์ดังกล่าวได้', 'error');
    }
  }, 200);
}

function closeDuplicateModal() {
  _pendingSaveData = null;
  setSaveButtonLoading(false);
  const modal = document.getElementById('duplicateModal');
  if (modal) modal.style.display = 'none';
}

/**
 * เมื่อ user กด "ยืนยัน แจ้งซ่อมเพิ่มเติม" ใน duplicate modal
 */
function confirmSaveDespiteDuplicate() {
  const confirmBtn = document.getElementById('btnConfirmDuplicate');
  if (confirmBtn) {
    confirmBtn.disabled = true;
    confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังบันทึก...';
  }
  if (_pendingSaveData) {
    const payload = _pendingSaveData;
    _pendingSaveData = null;
    const modal = document.getElementById('duplicateModal');
    if (modal) modal.style.display = 'none';
    if (confirmBtn) {
      confirmBtn.disabled = false;
      confirmBtn.innerHTML = '<i class="fas fa-check"></i> ยืนยัน แจ้งซ่อมเพิ่มเติม';
    }
    doSaveRequest(payload.data, payload.mode, payload.uuid);
  } else {
    const modal = document.getElementById('duplicateModal');
    if (modal) modal.style.display = 'none';
    if (confirmBtn) {
      confirmBtn.disabled = false;
      confirmBtn.innerHTML = '<i class="fas fa-check"></i> ยืนยัน แจ้งซ่อมเพิ่มเติม';
    }
  }
}

/**
 * แสดง duplicate warning modal
 */
function showDuplicateModal(equipmentCode, existingRequests, data, mode, uuid) {
  setSaveButtonLoading(false);
  const equipEl = document.getElementById('dupEquipCode');
  if (equipEl) equipEl.textContent = equipmentCode;
  const listEl = document.getElementById('dupRequestList');
  if (listEl) {
    const reqs = Array.isArray(existingRequests) ? existingRequests : [];
    listEl.innerHTML = reqs.map(function(r) {
      const rawDamage = String(r.damageAppearance || '-');
      const damageSnippet = rawDamage.length > 60 ? rawDamage.substring(0, 60) + '...' : rawDamage;
      return '<div class="dup-request-item">' +
             '<span class="dup-rid">ใบที่ ' + escapeHtml(String(r.requestId || '-')) + '</span>' +
             '<span class="dup-status">' + escapeHtml(String(r.status || '')) + '</span>' +
             '<div style="margin-top:4px;color:#555;">' +
             '📅 ' + escapeHtml(String(r.informDate || '-')) + '  |  อาการ: ' + escapeHtml(damageSnippet) +
             '</div></div>';
    }).join('') || '<div style="color:#64748B;padding:8px;">พบรายการที่ยังไม่เสร็จสิ้น</div>';
  }
  _pendingSaveData = { data: data, mode: mode, uuid: uuid };
  const modal = document.getElementById('duplicateModal');
  if (modal) {
    modal.style.display = 'flex';
  }
}

function populateTechDropdown(selectId, techs, selectedValue, defaultLabel) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  const label = defaultLabel || (selectId === 'tActionBy1' ? '-- เลือกช่างผู้รับผิดชอบหลัก --' : '-- ไม่มี / เลือกช่าง --');
  let html = '<option value="">' + escapeHtml(label) + '</option>';
  let found = false;
  (techs || []).forEach(function(t) {
    const isSel = (selectedValue && (selectedValue === t.employeeId || selectedValue === t.fullName)) ? 'selected' : '';
    if (isSel) found = true;
    html += '<option value="' + escapeAttr(t.employeeId) + '" ' + isSel + '>' +
            escapeHtml(t.employeeId + ' - ' + t.fullName) + '</option>';
  });
  if (selectedValue && !found) {
    html += '<option value="' + escapeAttr(selectedValue) + '" selected>' + escapeHtml(selectedValue) + '</option>';
  }
  sel.innerHTML = html;
}

/**
 * ตรวจจับการเปลี่ยนตัวเลือกช่าง และป้องกันไม่ให้เลือกช่างคนเดียวกันซ้ำข้ามช่อง

  const s3 = document.getElementById('tActionBy3');

  const val2 = s2.value.trim();
  const val3 = s3.value.trim();

  const changedEl = document.getElementById(changedSelectId);
  const changedVal = changedEl ? changedEl.value.trim() : '';

  if (changedVal) {
    let duplicate = false;
    if (changedSelectId === 'tActionBy1' && (changedVal === val2 || changedVal === val3)) duplicate = true;
    if (changedSelectId === 'tActionBy2' && (changedVal === val1 || changedVal === val3)) duplicate = true;
    if (changedSelectId === 'tActionBy3' && (changedVal === val1 || changedVal === val2)) duplicate = true;

    if (duplicate) {
      showToast('รหัสพนักงานช่างนี้ถูกเลือกในช่องอื่นแล้ว ไม่สามารถเลือกซ้ำได้', 'warning');
      changedEl.value = '';
    }
  }

  refreshTechDropdowns();
}

/**
 * ปิดการเลือก (disable) รายชื่อช่างที่ถูกเลือกไปแล้วในช่องอื่น
 */
function refreshTechDropdowns() {
  const ids = ['tActionBy1', 'tActionBy2', 'tActionBy3'];
  const selects = ids.map(function(id) { return document.getElementById(id); });
  if (selects.some(function(s) { return !s; })) return;

  const values = selects.map(function(s) { return s.value.trim(); });

  selects.forEach(function(sel, index) {
    const otherValues = values.filter(function(v, i) { return i !== index && v !== ''; });
    Array.from(sel.options).forEach(function(opt) {
      if (!opt.value) {
        opt.disabled = false;
      } else {
        opt.disabled = otherValues.includes(opt.value);
      }
    });
  });
}

function handleSaveTechnicianReport() {
  const uuid = document.getElementById('techFormUUID').value;
  if (!uuid) {
    showToast('ไม่พบรหัสใบแจ้งซ่อม', 'error');
    return;
  }

  const maintenanceDetails = document.getElementById('tMaintenanceDetails').value.trim();
  const actualRepairTime = document.getElementById('tActualRepairTime').value.trim();
  const completeDate = document.getElementById('tCompleteDate').value;
  const completeTime = document.getElementById('tCompleteTime').value;
  const actionBy1 = document.getElementById('tActionBy1') ? document.getElementById('tActionBy1').value.trim() : '';
  const actionBy2 = document.getElementById('tActionBy2') ? document.getElementById('tActionBy2').value.trim() : '';
  const actionBy3 = document.getElementById('tActionBy3') ? document.getElementById('tActionBy3').value.trim() : '';

  if (!actionBy1) {
    showToast('กรุณาเลือกช่างผู้รับผิดชอบหลัก (คนที่ 1)', 'error');
    if (document.getElementById('tActionBy1')) document.getElementById('tActionBy1').focus();
    return;
  }

  // ป้องกันการเลือกช่างซ้ำกัน
  const selectedTechs = [actionBy1, actionBy2, actionBy3].filter(Boolean);
  const uniqueTechs = new Set(selectedTechs);
  if (uniqueTechs.size !== selectedTechs.length) {
    showToast('ไม่สามารถเลือกช่างผู้ปฏิบัติงานซ้ำกันได้ กรุณาตรวจสอบรายชื่อช่างคนที่ 1, 2 และ 3', 'error');
    return;
  }

  if (!maintenanceDetails) {
    showToast('กรุณาระบุรายละเอียดในการซ่อมบำรุง (ข้อ 2.1)', 'error');
    document.getElementById('tMaintenanceDetails').focus();
    return;
  }

  if (!actualRepairTime) {
    showToast('กรุณาระบุเวลาที่ใช้ซ่อมจริง (เช่น 2 ชม.)', 'error');
    document.getElementById('tActualRepairTime').focus();
    return;
  }

  if (!completeDate || !completeTime) {
    showToast('กรุณาระบุวันและเวลาที่แล้วเสร็จ', 'error');
    return;
  }

  // รวบรวมข้อมูลอะไหล่
  const rows = document.querySelectorAll('#sparePartsTbody tr');
  const spareParts = [];
  rows.forEach(function(tr) {
    const name = tr.querySelector('.sp-name').value.trim();
    const partNo = tr.querySelector('.sp-no').value.trim();
    const typeModel = tr.querySelector('.sp-type').value.trim();
    const qty = tr.querySelector('.sp-qty').value.trim();
    const price = tr.querySelector('.sp-price').value.trim();
    if (name || partNo || typeModel || qty || price) {
      spareParts.push({
        sparePartName: name,
        partNo: String(partNo),
        typeModel: typeModel,
        qty: qty,
        price: price
      });
    }
  });

  // กำหนดชื่อผู้ซ่อม/ผู้บันทึกผล (technicianName) ให้ตรงกับช่างหลักคนที่ 1 เสมอ
  let leadTechName = '';
  if (techniciansListCache && techniciansListCache.length > 0) {
    const matchedTech = techniciansListCache.find(function(t) { return t.employeeId === actionBy1; });
    if (matchedTech) leadTechName = matchedTech.fullName;
  }
  if (!leadTechName && currentUser && currentUser.employeeId === actionBy1) {
    leadTechName = currentUser.fullName;
  }
  if (!leadTechName) {
    leadTechName = actionBy1;
  }

  const techData = {
    maintenanceDetails: maintenanceDetails,
    actualRepairTime: actualRepairTime,
    completeDate: completeDate,
    completeTime: completeTime,
    actionBy1: actionBy1,
    actionBy2: actionBy2,
    actionBy3: actionBy3,
    technicianName: leadTechName,
    technicianEmpId: actionBy1,
    estimateDate: formatDateDMY(document.getElementById('tEstimateDate') ? document.getElementById('tEstimateDate').value : ''),
    estimateTime: document.getElementById('tEstimateTime') ? document.getElementById('tEstimateTime').value : '',
    spareParts: spareParts
  };

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        showToast(result.message, 'success');
        showPage('dashboardPage');
        loadDashboardData(true);
      } else {
        showToast(result.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .saveTechnicianReport(uuid, techData);
}

function handleEndorsementRework() {
  if (!currentEndorsementRequest) return;
  const reason = document.getElementById('endReworkReason').value.trim();
  if (!reason) {
    showToast('กรุณาระบุเหตุผลที่ส่งกลับให้ช่างแก้ไข', 'error');
    document.getElementById('endReworkReason').focus();
    return;
  }

  const uuid = currentEndorsementRequest.UUID;
  const userRole = (currentUser.role || 'user').toLowerCase();
  const st = (currentEndorsementRequest.Status || '').toString().trim();

  showLoading();
  const callback = function(result) {
    hideLoading();
    if (result.success) {
      showToast(result.message, 'success');
      closeEndorsementModal();
      loadDashboardData(true);
    } else {
      showToast(result.message, 'error');
    }
  };

  if (st === 'รอ Supervisor ตรวจสอบ' || userRole === 'supervisor') {
    google.script.run
      .withSuccessHandler(callback)
      .withFailureHandler(function(e) { hideLoading(); showToast('เกิดข้อผิดพลาด: ' + e.message, 'error'); })
      .supervisorReject(uuid, currentUser.employeeId, reason);
  } else {
    google.script.run

let heartbeatInterval = null;
let latestActiveUsersData = null;

function startHeartbeat() {
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  sendUserHeartbeat(); // ส่งทันทีครั้งแรก
  heartbeatInterval = setInterval(sendUserHeartbeat, 45000); // ส่งซ้ำทุกๆ 45 วินาที
}

function stopHeartbeat() {
  if (heartbeatInterval) {
    clearInterval(heartbeatInterval);
    heartbeatInterval = null;
  }
}

function sendUserHeartbeat() {
  if (!currentUser || !currentUser.employeeId) return;

  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
  const payload = {
    employeeId: currentUser.employeeId,
    fullName: currentUser.fullName || '',
    role: (currentUser.role || 'user').toLowerCase(),
    deviceType: isMobile ? 'Mobile' : 'Desktop',
    currentTab: (typeof currentDashboardTab !== 'undefined' ? currentDashboardTab : 'requests')
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        updateActiveUsersUI(res);
      }
    })
    .withFailureHandler(function(err) {
      console.warn('Heartbeat ping failed:', err);
    })
    .recordUserHeartbeat(payload);
}

function updateActiveUsersUI(res) {
  if (!res) return;
  const count = res.activeCount || 1;
  const navCountEl = document.getElementById('navActiveUsersCount');
  if (navCountEl) {
    navCountEl.textContent = count + ' ออนไลน์';
  }
  const tbCountEl = document.getElementById('toolbarActiveCount');
  if (tbCountEl) {
    tbCountEl.textContent = 'ออนไลน์ ' + count + ' คน';
  }

  if (res.activeUsers) {
    latestActiveUsersData = res.activeUsers;
    const modal = document.getElementById('activeUsersModal');
    if (modal && modal.style.display !== 'none') {
      renderActiveUsersModalContent(res.activeUsers, count);
    }

}

    html += '<tr style="border-bottom:1px solid #F1F5F9; ' + (isMe ? 'background:#F0FDF4;' : '') + '">';
    html += '<td style="padding:10px 12px;">' +

let currentPmStatusFilter = '';
let currentPmBatchImportData = [];
let currentActivePmRequest = null;
let currentActivePmTemplate = null;
let currentPmChecklistState = [];

function filterPmStatus(status) {
  currentPmStatusFilter = status;
  const select = document.getElementById('pmStatusFilter');
  if (select) select.value = status;
  filterPmTable();
}

function filterPmTable() {
  const searchEl = document.getElementById('pmSearchInput');
  const searchTerm = searchEl ? searchEl.value.toLowerCase().trim() : '';
  const statusEl = document.getElementById('pmStatusFilter');
  const statusFilter = statusEl ? statusEl.value : '';
  const monthEl = document.getElementById('pmMonthFilter');
  const monthFilter = monthEl ? monthEl.value : '';
  const yearEl = document.getElementById('pmYearFilter');
  const yearFilter = yearEl ? yearEl.value : '';

  let filtered = (allRequests || []).filter(function(r) {
    return isPmRequest(r);
  });

  if (statusFilter) {
    filtered = filtered.filter(function(r) {
      const st = (r.Status || 'รอดำเนินการ').toString().trim();
      if (statusFilter === 'COMPLETE') return st === 'COMPLETE';
      if (statusFilter === 'เสร็จสิ้น') return st === 'เสร็จสิ้น' || st === 'เสร็จสิ้น (Return to Service)' || st === 'COMPLETE';
      if (statusFilter === 'รอตรวจสอบ') return st === 'รอ Supervisor ตรวจสอบ' || st === 'รอ Manager อนุมัติ' || st === 'รอตรวจสอบ';
      if (statusFilter === 'กำลังซ่อม') return st === 'กำลังซ่อม' || st === 'กำลังทำ PM' || st === 'IN PROGRESS';
      if (statusFilter === 'รอดำเนินการ') return st === 'รอดำเนินการ' || st === 'DRAFT' || st === 'PENDING';
      return st === statusFilter;
    });
  }

  if (monthFilter) {
    const targetMonth = parseInt(monthFilter, 10);
    filtered = filtered.filter(function(r) {
      const d = r.InformDate || r.TargetDate || '';
      if (!d) return false;
      const parts = d.toString().split(/[\/\-]/);
      if (parts.length >= 3) {
        let m = -1;
        if (parts[0].length === 4) m = parseInt(parts[1], 10); // YYYY-MM-DD
        else m = parseInt(parts[1], 10); // DD/MM/YYYY
        return m === targetMonth;
      }
      return false;
    });
  }

  if (yearFilter) {
    const targetYear = parseInt(yearFilter, 10);
    filtered = filtered.filter(function(r) {
      const d = r.InformDate || r.TargetDate || '';
      if (!d) return false;
      const parts = d.toString().split(/[\/\-]/);
      if (parts.length >= 3) {
        let y = -1;
        if (parts[0].length === 4) y = parseInt(parts[0], 10);
        else y = parseInt(parts[2], 10);
        return y === targetYear;
      }
      return false;
    });
  }

  if (searchTerm) {
    filtered = filtered.filter(function(r) {
      return (r.RequestID || '').toString().toLowerCase().indexOf(searchTerm) !== -1 ||
             (r.WorkOrderNo || '').toString().toLowerCase().indexOf(searchTerm) !== -1 ||
             (r.EquipmentCode || '').toString().toLowerCase().indexOf(searchTerm) !== -1 ||
             (r.EquipmentName || '').toString().toLowerCase().indexOf(searchTerm) !== -1 ||
             (r.DamageAppearance || '').toString().toLowerCase().indexOf(searchTerm) !== -1 ||
             (r.PmCheckLevel || '').toString().toLowerCase().indexOf(searchTerm) !== -1;
    });
  }

  renderPmTable(filtered);
}

function populateDynamicYearSelects() {
  const nowYear = new Date().getFullYear();
  const minYear = 2025;
  const maxYear = Math.max(2036, nowYear + 10);
  const yearSet = {};
  for (let y = minYear; y <= maxYear; y++) {
    yearSet[y] = true;
  }
  (allRequests || []).forEach(function(r) {
    const dStr = (r.InformDate || r.TargetDate || r.DueDate || '').toString().trim();
    const m = dStr.match(/\b(20\d{2})\b/);
    if (m) {
      const yNum = parseInt(m[1], 10);
      if (yNum >= 2020 && yNum <= 2100) yearSet[yNum] = true;
    }
  });
  const sortedYears = Object.keys(yearSet).map(Number).sort(function(a, b) { return a - b; });

  const selectConfigs = [
    { id: 'pmYearFilter', includeAll: true, defaultYear: String(nowYear) },
    { id: 'pmImportYear', includeAll: false, defaultYear: String(nowYear) },
    { id: 'restoreWoYear', includeAll: false, defaultYear: String(nowYear) }
  ];

  selectConfigs.forEach(function(cfg) {
    const sel = document.getElementById(cfg.id);
    if (!sel) return;
    const prevVal = sel.value;
    const hasPrev = prevVal !== undefined && prevVal !== null && (prevVal === '' || yearSet[parseInt(prevVal, 10)]);
    let html = '';
    if (cfg.includeAll) {
      html += '<option value="">ทุกปี (All Years)</option>';
    }
    sortedYears.forEach(function(yr) {
      html += '<option value="' + yr + '">' + yr + '</option>';
    });
    sel.innerHTML = html;
    if (hasPrev) {
      sel.value = prevVal;
    } else {
      sel.value = cfg.defaultYear;
    }
  });
}

function renderPmDashboard() {
  populateDynamicYearSelects();
  recomputeAndUpdateCounts();
  filterPmTable();
}

function renderPmTable(pmRequests) {
  const tbody = document.getElementById('pmTableBody');
  if (!tbody) return;

  const userRole = (currentUser ? (currentUser.role || 'user') : 'user').toLowerCase();

    const targetDateText = r.InformDate || r.TargetDate || '-';

    const rUuid = (r.UUID || '').toString().trim();

              '</td>';

    html += '<td data-label="เลขที่แผน PM" style="font-weight: 700; color: #2563EB;">' + escapeHtml(r.RequestID || '') + '</td>';
    html += '<td data-label="W/O No.">' + woDisplay + '</td>';
    html += '<td data-label="รหัสอุปกรณ์ (GSE)"><span class="cell-equipment-code">' + escapeHtml(r.EquipmentCode || '') + '</span></td>';
    html += '<td data-label="ชื่ออุปกรณ์">' + escapeHtml(r.EquipmentName || '') + '</td>';

    // 5. ปุ่ม Admin แก้ไขข้อมูลแผน PM (Edit)
    if (isAdmin) {
      html += '<button class="btn btn-icon btn-edit" title="แก้ไขข้อมูลแผน PM (Admin)" onclick="event.stopPropagation(); openEditPmModal(' + index + ', \'' + escapeAttr(rUuid) + '\', \'' + escapeAttr(rReqId) + '\')">' +
              '<i class="fas fa-edit"></i><span class="btn-text">แก้ไข</span></button>';
    }

    // 6. ปุ่ม Admin ปิดงานในระบบและ Sheet (เมื่อ COMPLETE)
    if (isAdmin && reqStatus === 'COMPLETE') {
      html += '<button class="btn btn-icon btn-close-wo" title="Admin: ปิดงานในระบบและ Sheet W/O (CLOSED)" onclick="event.stopPropagation(); handlePmAdminDirectCloseRow(' + index + ', \'' + escapeAttr(rUuid) + '\')">' +
              '<i class="fas fa-folder-minus"></i><span class="btn-text">ปิด W/O</span></button>';
    } else if (isAdmin && (reqStatus === 'เสร็จสิ้น' || reqStatus === 'เสร็จสิ้น (Return to Service)')) {
      html += '<button class="btn btn-icon btn-wo-closed" title="ปิดงานแล้ว (CLOSED)" disabled>' +
              '<i class="fas fa-check-circle"></i><span class="btn-text">ปิดแล้ว</span></button>';
    }

    // 7. ปุ่ม Admin ลบ (Delete)
    if (isAdmin) {
      html += '<button class="btn btn-icon btn-delete" title="ลบรายการ PM" onclick="event.stopPropagation(); handleDeletePmRow(' + index + ', \'' + escapeAttr(rUuid) + '\', \'' + escapeAttr(rReqId) + '\', \'' + escapeAttr(r.EquipmentCode || '') + '\')">' +
              '<i class="fas fa-trash"></i><span class="btn-text">ลบ</span></button>';
    }

    html += '</div></td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;
  if (selectAllCb) selectAllCb.checked = allVisibleSelected;
  updatePmBulkSelectionUI();
}

function toggleSelectPmRow(rowKey, checked, checkboxEl) {
  if (!rowKey) return;
  window._selectedPmKeys = window._selectedPmKeys || {};
  if (checked) {
    window._selectedPmKeys[rowKey] = true;
  } else {
    delete window._selectedPmKeys[rowKey];
  }
  if (checkboxEl) {
    const tr = checkboxEl.closest('tr');
    if (tr) tr.style.backgroundColor = checked ? '#FEF2F2' : '';
  }
  const checkboxes = document.querySelectorAll('#pmTableBody .pm-row-checkbox');
  const selectAllCb = document.getElementById('pmSelectAllCheckbox');
  if (selectAllCb && checkboxes.length > 0) {
    let allChk = true;
    checkboxes.forEach(function(cb) { if (!cb.checked) allChk = false; });
    selectAllCb.checked = allChk;
  }
  updatePmBulkSelectionUI();
}

function toggleSelectAllPmRows(checked) {
  window._selectedPmKeys = window._selectedPmKeys || {};
  const checkboxes = document.querySelectorAll('#pmTableBody .pm-row-checkbox');
  checkboxes.forEach(function(cb) {
    cb.checked = checked;
    const key = cb.getAttribute('data-key');
    if (key) {
      if (checked) {
        window._selectedPmKeys[key] = true;
      } else {
        delete window._selectedPmKeys[key];
      }
    }
    const tr = cb.closest('tr');
    if (tr) tr.style.backgroundColor = checked ? '#FEF2F2' : '';
  });
  updatePmBulkSelectionUI();
}

function updatePmBulkSelectionUI() {
  const userRole = (currentUser ? (currentUser.role || 'user') : 'user').toLowerCase();
  const isAdmin = userRole === 'admin';
  const btn = document.getElementById('btnBulkDeletePmToolbar');
  const badge = document.getElementById('pmSelectedCountBadge');
  if (!btn) return;

  window._selectedPmKeys = window._selectedPmKeys || {};
  // กรองเฉพาะรายการที่ยังอยู่ใน allRequests จริง
  const activePmKeys = {};
  (allRequests || []).forEach(function(r) {
    if (!isPmRequest(r)) return;
    const k = (r.UUID || r.RequestID || '').toString().trim();
    if (k && window._selectedPmKeys[k]) {
      activePmKeys[k] = true;
    }
  });
  window._selectedPmKeys = activePmKeys;
  const count = Object.keys(activePmKeys).length;

  if (badge) badge.textContent = count;
  if (isAdmin && count > 0) {
    btn.style.display = 'inline-flex';
  } else {
    btn.style.display = 'none';
  }
}

function handleBulkDeletePm() {
  if (!currentUser || (currentUser.role || '').toLowerCase() !== 'admin') {
    showToast('เฉพาะ Admin เท่านั้นที่มีสิทธิ์ลบแผน PM', 'error');
    return;
  }
  window._selectedPmKeys = window._selectedPmKeys || {};
  const selectedKeys = Object.keys(window._selectedPmKeys);
  if (selectedKeys.length === 0) {
    showToast('กรุณาติ๊กเลือกรายการแผน PM ที่ต้องการลบอย่างน้อย 1 รายการ', 'warning');
    return;
  }

  const itemsToDelete = [];
  const sampleLabels = [];
  (allRequests || []).forEach(function(r) {
    if (!isPmRequest(r)) return;
    const u = (r.UUID || '').toString().trim();
    const rid = (r.RequestID || '').toString().trim();
    const key = u || rid;
    if (key && window._selectedPmKeys[key]) {
      itemsToDelete.push({ uuid: u, requestId: rid });
      if (sampleLabels.length < 5) {
        sampleLabels.push((rid || '') + (r.EquipmentCode ? ' (' + r.EquipmentCode + ')' : ''));
      }
    }
  });

  if (itemsToDelete.length === 0) {
    showToast('ไม่พบรายการที่เลือก', 'error');
    return;
  }

  let detailMsg = 'คุณต้องการลบแผนงาน PM ที่เลือกจำนวน ' + itemsToDelete.length + ' รายการ ใช่หรือไม่?';
  if (sampleLabels.length > 0) {
    detailMsg += '\nตัวอย่าง: ' + sampleLabels.join(', ') + (itemsToDelete.length > 5 ? ' และอื่นๆ' : '');
  }

  openAppConfirmModal(
    'ยืนยันการลบหลายรายการ (' + itemsToDelete.length + ' ใบงาน)',
    detailMsg,
    function() { executeBulkDeletePmConfirmed(itemsToDelete); },
    true
  );
}

function executeBulkDeletePmConfirmed(itemsToDelete) {
  if (!itemsToDelete || itemsToDelete.length === 0) return;

  showLoading();
  window._recentlyDeletedIds = window._recentlyDeletedIds || [];
  const nowTs = Date.now();
  const delSet = {};

  itemsToDelete.forEach(function(it) {
    const u = (it.uuid || '').toString().trim();
    const r = (it.requestId || '').toString().trim();
    if (u) {
      window._recentlyDeletedIds.push({ id: u, ts: nowTs });
      delSet[u.toLowerCase()] = true;
    }
    if (r) {
      window._recentlyDeletedIds.push({ id: r, ts: nowTs });
      delSet[r.toLowerCase()] = true;
    }
  });

  // Optimistic UI Update: ลบออกจากหน่วยความจำทันที 0ms
  allRequests = (allRequests || []).filter(function(r) {
    const u = (r.UUID || '').toString().trim().toLowerCase();
    const rid = (r.RequestID || '').toString().trim().toLowerCase();
    return !(delSet[u] || delSet[rid]);
  });

  window._selectedPmKeys = {};
  const selectAllCb = document.getElementById('pmSelectAllCheckbox');
  if (selectAllCb) selectAllCb.checked = false;

  try {
    localStorage.removeItem('cached_dashboard_data');
  } catch (e) {}

  renderPmDashboard();
  recomputeAndUpdateCounts();

  const adminEmpId = currentUser ? (currentUser.employeeId || '') : '';
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result && result.success) {
        showToast(result.message || ('ลบรายการ PM จำนวน ' + itemsToDelete.length + ' ใบงานเรียบร้อยแล้ว'), 'success');
        setTimeout(function() {
          loadDashboardData(true);
        }, 800);
      } else {
        showToast((result && result.message) || 'เกิดข้อผิดพลาดในการลบหลายรายการ', 'error');
        loadDashboardData(true);
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('เกิดข้อผิดพลาด: ' + (err.message || err), 'error');
      loadDashboardData(true);
    })
    .deleteMultipleRequests(itemsToDelete, adminEmpId);
}

function openEditPmModal(index, optUuid, optReqId) {
  if (window.event) window.event.stopPropagation();
  if (!currentUser || (currentUser.role || '').toLowerCase() !== 'admin') {
    showToast('เฉพาะ Admin เท่านั้นที่มีสิทธิ์แก้ไขแผน PM', 'error');
    return;
  }

  let req = (window._pmRequestsList && window._pmRequestsList[index]) || null;
  const id1 = (optUuid || '').toString().trim();
  const id2 = (optReqId || '').toString().trim();
  if (!req && window._pmRequestsMap) {
    req = (id1 && window._pmRequestsMap[id1]) || (id2 && window._pmRequestsMap[id2]);
  }
  if (!req && allRequests) {
    req = allRequests.find(function(r) {
      const u = (r.UUID || '').toString().trim();
      const rid = (r.RequestID || '').toString().trim();
      return (id1 && (u === id1 || rid === id1)) || (id2 && (u === id2 || rid === id2));
    });
  }
  if (!req) {
    showToast('ไม่พบข้อมูลรายการ PM ที่ต้องการแก้ไข', 'error');
    return;
  }

  _editingPmUuid = (req.UUID || '').toString().trim();
  _editingPmReqId = (req.RequestID || '').toString().trim();
  setPmModalHeaderMode(true, _editingPmReqId || req.EquipmentCode);

  const modal = document.getElementById('pmCreateModal');
  if (!modal) return;
  const form = document.getElementById('pmCreateForm');
  if (form) form.reset();

  const eqCodeEl = document.getElementById('pmCreateEqCode');
  const eqNameEl = document.getElementById('pmCreateEqName');
  const checkSel = document.getElementById('pmCreateCheckLevel');
  const dateInput = document.getElementById('pmCreateTargetDate');
  const woNoEl = document.getElementById('pmCreateWoNo');
  const hrKmEl = document.getElementById('pmCreateHrKm');
  const notesEl = document.getElementById('pmCreateNotes');

  if (eqCodeEl) eqCodeEl.value = req.EquipmentCode || '';
  if (eqNameEl) eqNameEl.value = req.EquipmentName || '';

  // แปลงระดับการตรวจให้ตรงกับตัวเลือกใน Select
  const rawCheck = (req.PmCheckLevel || req.DamageAppearance || 'A').toString().toUpperCase().trim();
  const strippedCheck = rawCheck.replace(/\bPM\b/g, '').replace(/\bCHECK\b/g, '').replace(/\bSCHEDULE\b/g, '').trim();
  let selVal = 'Check A';
  if (rawCheck.indexOf('MONTHLY') !== -1 || (req.EquipmentCode || '').indexOf('TLM-TB-') === 0 || /^PM\s+(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)$/.test(rawCheck)) {
    selVal = 'PM Monthly';
  } else if (strippedCheck === 'C' || /\bC\b/.test(strippedCheck)) {
    selVal = 'Check C';
  } else if (strippedCheck === 'B' || /\bB\b/.test(strippedCheck)) {
    selVal = 'Check B';
  }
  if (checkSel) checkSel.value = selVal;

  if (dateInput) {
    dateInput.value = parseDateToInput(req.InformDate || req.TargetDate || '') || new Date().toISOString().split('T')[0];
  }
  if (woNoEl) woNoEl.value = req.WorkOrderNo || '';
  if (hrKmEl) hrKmEl.value = normalizePmHrMeter(req.HrKm, req.EquipmentCode, req.EquipmentName);

  let existingNotes = '';
  const rawJson = req.PmChecklistData || req.MaintenanceDetails;
  if (rawJson) {
    try {
      const parsed = (typeof rawJson === 'object') ? rawJson : JSON.parse(rawJson);
      existingNotes = parsed.notes || '';
    } catch(e) {}
  }
  if (notesEl) notesEl.value = existingNotes;

  handlePmCodeInput(req.EquipmentCode || '');
  modal.style.display = 'flex';

  if (equipmentMasterList && equipmentMasterList.length > 0) {
    populatePmEquipmentDatalist();
  } else {
    loadEquipmentMaster(function() {
      populatePmEquipmentDatalist();
    });
  }
}

function closeCreatePmModal() {
  const modal = document.getElementById('pmCreateModal');
  if (modal) modal.style.display = 'none';
  _editingPmUuid = '';
  _editingPmReqId = '';
}

function handlePmCodeInput(rawCode) {
  const code = (rawCode || '').toUpperCase().trim();
  const feedbackEl = document.getElementById('pmCreateEqFeedback');
  const nameEl = document.getElementById('pmCreateEqName');
  const checkSel = document.getElementById('pmCreateCheckLevel');
  if (!feedbackEl) return;

  if (!code) {
    feedbackEl.innerHTML = '';
    if (nameEl) nameEl.value = '';
    return;
  }

  // หากเป็น Towbar (TLM-TB-) ให้เลือก PM Monthly อัตโนมัติ
  if (code.indexOf('TLM-TB-') === 0 && checkSel) {
    checkSel.value = 'PM Monthly';
  }
  const hrKmInput = document.getElementById('pmCreateHrKm');
  if (hrKmInput) {
    if (typeof isNonEngineGse === 'function' && isNonEngineGse(code)) {
      if (!hrKmInput.value || hrKmInput.value === '-' || hrKmInput.value === '0') hrKmInput.value = 'N/A';
    } else if (!_editingPmUuid && !_editingPmReqId && hrKmInput.value === 'N/A') {
      hrKmInput.value = '';
    }
  }

  if (equipmentMasterList && equipmentMasterList.length > 0) {
    const item = findEquipmentInMaster(code);
    if (item) {
      feedbackEl.innerHTML = '<span style="color:#16A34A;"><i class="fas fa-check-circle"></i> พบในระบบ: <b>' + escapeHtml(item.gseNo) + '</b> — ' + escapeHtml(item.description || item.gseNo) + (item.serialNo ? ' (S/N: ' + item.serialNo + ')' : '') + '</span>';
      if (nameEl) nameEl.value = item.description || '';
    } else if (code.length >= 7) {
      feedbackEl.innerHTML = '<span style="color:#D97706;"><i class="fas fa-info-circle"></i> รหัส ' + escapeHtml(code) + ' (กำลังตรวจสอบกับฐานข้อมูล GSE MASTER)</span>';
    } else {
      feedbackEl.innerHTML = '<span style="color:#64748B;">กำลังพิมพ์รหัสอุปกรณ์...</span>';
    }
  } else if (!_pmMasterLoadTried) {
    _pmMasterLoadTried = true;
    loadEquipmentMaster(function() {
      populatePmEquipmentDatalist();
      handlePmCodeInput(rawCode);
    });
  }
}

function handleSavePmRequest() {
  if (!currentUser || (currentUser.role || '').toLowerCase() !== 'admin') {
    showToast('เฉพาะ Admin เท่านั้นที่มีสิทธิ์สร้างหรือแก้ไขแผน PM', 'error');
    return;
  }

  const codeInputEl = document.getElementById('pmCreateEqCode');
  let code = (codeInputEl ? codeInputEl.value : '').toUpperCase().trim();
  const nameEl = document.getElementById('pmCreateEqName');
  let name = nameEl ? nameEl.value.trim() : '';
  const checkLevel = document.getElementById('pmCreateCheckLevel').value;
  const targetDate = document.getElementById('pmCreateTargetDate').value;
  const woNoEl = document.getElementById('pmCreateWoNo');
  const hrKmEl = document.getElementById('pmCreateHrKm');
  const workOrderNo = woNoEl ? woNoEl.value.trim().replace(/\D/g, '') : '';
  let hrKm = normalizePmHrMeter(hrKmEl ? hrKmEl.value : '', code, name);
  const notes = document.getElementById('pmCreateNotes').value.trim();

  if (!code) {
    showToast('กรุณาระบุรหัสอุปกรณ์ (Equipment Code)', 'error');
    if (codeInputEl) codeInputEl.focus();
    return;
  }
  if (!targetDate) {
    showToast('กรุณาระบุกำหนดการเข้าตรวจ (Target Date)', 'error');
    return;
  }

  if (equipmentMasterList && equipmentMasterList.length > 0) {
    const matched = findEquipmentInMaster(code);
    if (matched) {
      code = matched.gseNo;
      if (!name) name = matched.description || code;
      if (codeInputEl) codeInputEl.value = code;
      if (nameEl) nameEl.value = name;
    } else {
      showToast('รหัสอุปกรณ์ "' + code + '" ไม่มีอยู่ในฐานข้อมูล GSE MASTER', 'error');
      return;
    }
  }

  const adminEmpId = currentUser ? currentUser.employeeId : '';
  showLoading();

  // กรณีอยู่ในโหมดแก้ไขแผน PM เดิม (Edit Mode)
  if (_editingPmUuid || _editingPmReqId) {
    const editUuid = _editingPmUuid;
    const editReqId = _editingPmReqId;
    google.script.run
      .withSuccessHandler(function(res) {
        hideLoading();
        if (res && res.success) {
          showToast(res.message || 'แก้ไขแผน PM สำเร็จ', 'success');
          closeCreatePmModal();
          if (allRequests && allRequests.length > 0) {
            const target = allRequests.find(function(r) {
              return (editUuid && r.UUID === editUuid) || (editReqId && r.RequestID === editReqId);
            });
            if (target) {
              target.EquipmentCode = res.equipmentCode || code;
              target.EquipmentName = res.equipmentName || name || code;
              target.WorkOrderNo = res.workOrderNo !== undefined ? res.workOrderNo : workOrderNo;
              if (res.informDate) {
                target.InformDate = res.informDate;
                target.DueDate = res.informDate;
              }
              if (res.damageAppearance) target.DamageAppearance = res.damageAppearance;
              if (res.pmCheckLevel) target.PmCheckLevel = res.pmCheckLevel;
              if (res.pmTaskCardTemplate) target.PmTaskCardTemplate = res.pmTaskCardTemplate;
              if (res.hrKm !== undefined) target.HrKm = res.hrKm;
              if (res.pmChecklistData) target.PmChecklistData = res.pmChecklistData;
            }
          }
          recomputeAndUpdateCounts();
          filterPmTable();
        } else {
          showToast((res && res.message) ? res.message : 'ไม่สามารถแก้ไขแผน PM ได้', 'error');
        }
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('เกิดข้อผิดพลาด: ' + (err.message || err), 'error');
      })
      .updatePmWorkOrder(editUuid, workOrderNo, targetDate, checkLevel, adminEmpId, {
        requestId: editReqId,
        equipmentCode: code,
        equipmentName: name || code,
        hrKm: hrKm,
        notes: notes
      });
    return;
  }

  // กรณีสร้างแผน PM ใหม่ (Create Mode)
  const pmData = {
    equipmentCode: code,
    equipmentName: name || code,
    checkLevel: checkLevel,
    targetDate: targetDate,
    planDate: targetDate,
    workOrderNo: workOrderNo,
    hrKm: hrKm,
    notes: notes
  };

  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res && res.success) {
        showToast(res.message || 'สร้างรายการ PM สำเร็จ', 'success');
        closeCreatePmModal();

        if (res.request) {
          if (!allRequests) allRequests = [];
          window._recentlyCreatedRequests = window._recentlyCreatedRequests || [];
          window._recentlyCreatedRequests.push({ req: res.request, ts: Date.now() });

          const existIdx = allRequests.findIndex(function(x) {
            return (res.request.UUID && x.UUID === res.request.UUID) ||
                   (res.request.RequestID && x.RequestID === res.request.RequestID);
          });
          if (existIdx >= 0) allRequests[existIdx] = res.request;
          else allRequests.unshift(res.request);

          switchDashboardTab('pm');
          const statusEl = document.getElementById('pmStatusFilter');
          if (statusEl && statusEl.value && statusEl.value !== 'รอดำเนินการ') statusEl.value = '';
          const monthEl = document.getElementById('pmMonthFilter');
          if (monthEl) monthEl.value = '';
          const yearEl = document.getElementById('pmYearFilter');
          if (yearEl) yearEl.value = '';
          const searchEl = document.getElementById('pmSearchInput');
          if (searchEl) searchEl.value = '';

          recomputeAndUpdateCounts();
          filterPmTable();
        } else {
          loadDashboardData(true);
        }
      } else {
        showToast((res && res.message) ? res.message : 'เกิดข้อผิดพลาดในการสร้าง PM', 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('เกิดข้อผิดพลาด: ' + (err.message || err), 'error');
    })
    .createPmRequest(pmData, adminEmpId);
}

function fillSamplePmBatchImport(count) {
  const total = count || 120;
  const master = (equipmentMasterList && equipmentMasterList.length > 0)
    ? equipmentMasterList.filter(function(x) { return !x.isInactive; })
    : (window.SANDBOX_GSE_MASTER || []);
  const mSel = document.getElementById('pmImportMonth');
  const monthIdx = mSel ? (parseInt(mSel.value, 10) || 11) : 11;
  const monthNames = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const mName = monthNames[(monthIdx - 1) % 12] || 'NOV';

  const sampleLines = [];
  const baseWo = 2347001;
  for (let i = 0; i < total; i++) {
    let eqCode = 'TLM-BC-' + String((i % 90) + 1).padStart(3, '0');
    if (master.length > 0) {
      eqCode = master[i % master.length].gseNo;
    }
    let chk = 'PM A';
    if (eqCode.indexOf('TLM-TB-') === 0) {
      chk = 'PM ' + mName;
    } else if (i % 7 === 0) {
      chk = 'PM B';
    } else if (i % 15 === 0) {
      chk = 'PM C';
    }
    const woNo = String(baseWo + i);
    sampleLines.push(eqCode + '\t' + chk + '\tPM\t' + woNo);
  }
  const pasteArea = document.getElementById('pmImportPasteArea');
  if (pasteArea) {
    pasteArea.value = sampleLines.join('\n');
  }
  handlePmImportPreview(false);
  showToast('สร้างข้อมูลตัวอย่าง PM จำนวน ' + total + ' รายการเรียบร้อยแล้ว กดปุ่ม "ยืนยันนำเข้าข้อมูล" ได้เลย', 'info');
}

function handlePmImportPreview(isSilent) {
  const pasteEl = document.getElementById('pmImportPasteArea');
  const rawText = pasteEl ? pasteEl.value.trim() : '';
  if (!rawText) {
    if (!isSilent) {
      showToast('กรุณาวางข้อมูลจาก Excel หรือชีต บันทึกการเปิด W/O ในช่องวางข้อมูลก่อน', 'warning');
      if (pasteEl) pasteEl.focus();
    }
    return;
  }

  // หากมี SANDBOX_GSE_MASTER ในหน่วยความจำให้นำมาใช้ทันที และหากยังไม่ได้โหลดจากเซิร์ฟเวอร์ให้โหลดแบบเบื้องหลังโดยไม่บล็อกการ Preview
  if (equipmentMasterList === null && typeof window !== 'undefined' && Array.isArray(window.SANDBOX_GSE_MASTER) && window.SANDBOX_GSE_MASTER.length > 0) {
    equipmentMasterList = window.SANDBOX_GSE_MASTER;
  }
  if (equipmentMasterList === null) {
    loadEquipmentMaster(function() {
      const modal = document.getElementById('pmImportModal');
      if (modal && modal.style.display !== 'none') {
        handlePmImportPreview(true);
      }
    });
  }

  let defaultMonth = document.getElementById('pmImportMonth') ? document.getElementById('pmImportMonth').value : '11';
  const defaultYear = document.getElementById('pmImportYear') ? document.getElementById('pmImportYear').value : '2026';
  const monthNames = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  const lines = rawText.split(/\r?\n/);
  currentPmBatchImportData = [];

  let validCount = 0;
  let invalidCount = 0;
  let html = '';
  let autoDetectedMonth = null;

  lines.forEach(function(line) {
    const trimmed = line.trim();
    if (!trimmed) return;
    // ข้ามเส้นคั่น เช่น ---------------------------------------------------------------------------
    if (/^[\-=*_\s]+$/.test(trimmed)) return;

    // ค้นหารหัสอุปกรณ์ TLM-XX-NNN จากทั้งบรรทัด (รองรับทั้งแบบมีเลขลำดับนำหน้า, คั่นด้วย Tab, คอมม่า, Pipe หรือเว้นวรรค)
    const eqMatch = trimmed.match(/\b(TLM-[A-Z0-9]{1,4}-\d{2,4}[A-Z]?)\b/i);
    let parts = trimmed.split(/[\t,;|]+|\s{2,}/).map(function(s) { return s.trim(); }).filter(Boolean);

    let code = '';
    let remainingTokens = [];

    if (eqMatch) {
      code = eqMatch[1].toUpperCase().trim();
      // ตัดรหัสอุปกรณ์และเลขลำดับข้างหน้าออกเพื่อสกัด Check Level, W/O และวันที่จากข้อความที่เหลือ
      const afterEq = trimmed.substring(trimmed.toUpperCase().indexOf(code) + code.length).trim();
      if (afterEq) {
        remainingTokens = afterEq.split(/[\t,;|]+|\s{2,}/).map(function(s) { return s.trim(); }).filter(Boolean);
        if (remainingTokens.length === 1 && /\s+/.test(afterEq)) {
          // กรณีคั่นด้วยเว้นวรรค 1 เคาะ เช่น "PM NOV PM 2346372" หรือ "PM A 2345234"
          const tokens = afterEq.split(/\s+/);
          let woTok = '';
          let dateTok = '';
          const chkTokens = [];
          for (let t = 0; t < tokens.length; t++) {
            const tk = tokens[t];
            if (/^\d{5,10}$/.test(tk) && !woTok) {
              woTok = tk;
            } else if ((/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(tk) || /^\d{4}-\d{1,2}-\d{1,2}$/.test(tk)) && !dateTok) {
              dateTok = tk;
            } else if (/^(OPEN|CLOSED|COMPLETE|NO|YES|NOT|PRINT|PRINTED)$/i.test(tk) || /^TL\d{6}$/i.test(tk)) {
              continue;
            } else {
              chkTokens.push(tk);
            }
          }
          if (chkTokens.length > 1 && /^(PM|CM)$/i.test(chkTokens[chkTokens.length - 1])) {
            chkTokens.pop();
          }
          remainingTokens = [chkTokens.join(' ') || 'Check A', woTok, dateTok].filter(Boolean);
        }
      }
    } else {
      const firstCol = (parts[0] || '').toUpperCase().trim();
      if (!firstCol || firstCol === 'EQ NO.' || firstCol === 'EQ NO' || firstCol === 'รหัสอุปกรณ์' || firstCol === 'GSE NO.' || firstCol === 'GSE NO' || firstCol === 'NO.' || firstCol === 'NO' || firstCol === 'ITEM') {
        return;
      }
      code = firstCol;
      remainingTokens = parts.slice(1);
    }

    let checkLvl = (code.indexOf('TLM-TB-') === 0) ? ('PM ' + monthNames[(parseInt(defaultMonth, 10) || 1) - 1]) : 'PM A';
    let workOrderNo = '';
    let targetDate = '';

    for (let i = 0; i < remainingTokens.length; i++) {
      const p = remainingTokens[i].trim();
      if (!p) continue;
      const pUpper = p.toUpperCase();

      // ข้ามคอลัมน์สถานะจากชีต บันทึกการเปิด W/O
      if ((pUpper === 'PM' || pUpper === 'CM') && i >= 1) continue;
      if (pUpper === 'OPEN' || pUpper === 'CLOSED' || pUpper === 'COMPLETE' || pUpper === 'NO' || pUpper === 'YES' || pUpper === 'NOT PRINT' || pUpper === 'PRINTED' || /^TL\d{6}$/.test(pUpper)) {
        continue;
      }
      // ตรวจจับวันที่รูปแบบ DD/MM/YYYY หรือ M/D/YYYY
      if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(p)) {
        const dp = p.split('/');
        const n0 = parseInt(dp[0], 10);
        const n1 = parseInt(dp[1], 10);
        const yyyy = dp[2];
        // ถ้าตัวแรก > 12 แปลว่าเป็น DD/MM/YYYY แน่นอน
        let mm = n0, dd = n1;
        if (n0 > 12) {
          dd = n0;
          mm = n1;
        } else if (n1 <= 12) {
          // รองรับ DD/MM/YYYY ตามมาตรฐานไทย
          dd = n0;
          mm = n1;
        }
        if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
          targetDate = yyyy + '-' + String(mm).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
        }
        continue;
      }
      if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(p)) {
        const dp = p.split('-');
        targetDate = dp[0] + '-' + dp[1].padStart(2, '0') + '-' + dp[2].padStart(2, '0');
        continue;
      }
      // ตรวจจับเลขที่ใบสั่งงาน W/O (ตัวเลขล้วน 5-10 หลัก เช่น 2346372)
      if (/^\d{5,10}$/.test(p) && !workOrderNo) {
        workOrderNo = p;
        continue;
      }
      // ตรวจจับระดับการทำ PM เช่น "PM NOV", "PM A", "PM B", "PM C", "Check A", "MONTHLY"
      if (i === 0 || /^(PM\s+|CHECK\s+|A$|B$|C$|MONTHLY)/i.test(pUpper)) {
        checkLvl = pUpper;
      }
    }

    // หากใน Check Level มีการระบุชื่อเดือน เช่น "PM NOV" ให้ตั้งวันที่แผนตามเดือนนั้นอัตโนมัติ (เช่น พ.ย. = เดือน 11)
    let detectedMonthIdx = -1;
    for (let mIdx = 0; mIdx < monthNames.length; mIdx++) {
      const mName = monthNames[mIdx];
      if (checkLvl === 'PM ' + mName || checkLvl === mName || new RegExp('\\b' + mName + '\\b').test(checkLvl)) {
        detectedMonthIdx = mIdx + 1;
        if (!autoDetectedMonth) autoDetectedMonth = detectedMonthIdx;
        break;
      }
    }

    if (!targetDate) {
      const mToUse = (detectedMonthIdx !== -1) ? detectedMonthIdx : defaultMonth;
      targetDate = defaultYear + '-' + String(mToUse).padStart(2, '0') + '-01';
    } else if (detectedMonthIdx !== -1) {
      // หากมีระบุชื่อเดือนชัดเจนในอาการ เช่น PM NOV ให้ใช้วันที่ในเดือนนั้นเป็นหลัก
      targetDate = defaultYear + '-' + String(detectedMonthIdx).padStart(2, '0') + '-01';
    }

    // ตรวจสอบกับฐานข้อมูล GSE MASTER และจับคู่แม่แบบใบงาน PM Task Card อัตโนมัติ
    let isValid = false;
    let eqDesc = '';
    let eqSerNo = '';
    const match = (equipmentMasterList && equipmentMasterList.length > 0) ? findEquipmentInMaster(code) : null;
    if (match) {
      isValid = true;
      code = match.gseNo;
      eqDesc = match.description || '';
      eqSerNo = match.serialNo || '';
    } else if (/^TLM-[A-Z0-9]{1,4}-\d{2,4}[A-Z]?$/i.test(code)) {
      // รองรับรหัส TLM- มาตรฐานแม้เป็นรถคันใหม่ที่เพิ่งเพิ่มเข้ามา
      isValid = true;
      const prefix = (code.split('-')[1] || '').toUpperCase();
      eqDesc = (typeof GSE_PREFIX_NAME_MAP !== 'undefined' && GSE_PREFIX_NAME_MAP[prefix]) ? GSE_PREFIX_NAME_MAP[prefix] : code;
      eqSerNo = code;
    }

    const modelKey = resolvePmModelKey(code, eqDesc);
    const cleanLvl = normalizePmCheckLevel(checkLvl);
    const tplKey = resolvePmTemplateKey(modelKey, cleanLvl);

    if (isValid) validCount++;
    else invalidCount++;

    currentPmBatchImportData.push({
      equipmentCode: code,
      equipmentName: eqDesc || code,
      serialNo: eqSerNo,
      checkLevel: checkLvl,
      templateKey: tplKey,
      workOrderNo: workOrderNo,
      targetDate: targetDate,
      planDate: targetDate,
      isValid: isValid
    });

    const statusBadge = isValid
      ? '<span style="color:#16A34A; font-weight:700;"><i class="fas fa-check-circle"></i> พร้อมนำเข้า</span>'
      : '<span style="color:#DC2626; font-weight:700;"><i class="fas fa-times-circle"></i> รหัสไม่ถูกต้อง</span>';

    html += '<tr style="background:' + (isValid ? '#FFFFFF' : '#FEF2F2') + '; border-bottom:1px solid #F1F5F9;">';
    html += '<td style="padding:6px 10px; text-align:center;">' + (currentPmBatchImportData.length) + '</td>';
    html += '<td style="padding:6px 10px; font-weight:700; color:' + (isValid ? '#1E293B' : '#DC2626') + ';">' + escapeHtml(code) + '</td>';
    html += '<td style="padding:6px 10px;"><div>' + escapeHtml(eqDesc || '-') + '</div>' + (eqSerNo ? '<div style="font-size:0.72rem; color:#64748B;">S/N: ' + escapeHtml(eqSerNo) + '</div>' : '') + '</td>';
    html += '<td style="padding:6px 10px; text-align:center;"><span class="pm-tc-badge">' + escapeHtml(checkLvl) + '</span></td>';
    html += '<td style="padding:6px 10px; text-align:center;"><span style="font-size:0.75rem; font-weight:700; color:#0284C7; background:#E0F2FE; padding:2px 8px; border-radius:6px;">' + escapeHtml(tplKey) + '</span></td>';
    html += '<td style="padding:6px 10px; text-align:center; font-weight:700; color:#2563EB;">' + escapeHtml(workOrderNo || '-') + '</td>';
    html += '<td style="padding:6px 10px; text-align:center;">' + escapeHtml(targetDate) + '</td>';
    html += '<td style="padding:6px 10px; text-align:center;">' + statusBadge + '</td>';
    html += '</tr>';
  });

  if (autoDetectedMonth && document.getElementById('pmImportMonth')) {
    document.getElementById('pmImportMonth').value = String(autoDetectedMonth);
  }

  const wrapper = document.getElementById('pmImportPreviewWrapper');
  if (wrapper) wrapper.style.display = currentPmBatchImportData.length > 0 ? 'block' : 'none';
  const tbody = document.getElementById('pmImportPreviewTbody');
  if (tbody) tbody.innerHTML = html;

  const summary = document.getElementById('pmImportSummaryBadge');
  if (summary) {
    summary.innerHTML = '<span style="color:#16A34A;"><i class="fas fa-check-circle"></i> พร้อมนำเข้า ' + validCount + ' รายการ</span>' +
      (invalidCount > 0 ? ' | <span style="color:#DC2626;">ไม่ผ่าน ' + invalidCount + ' รายการ</span>' : '');
  }

  const execBtn = document.getElementById('btnExecuteBatchImport');
  if (execBtn) {
    execBtn.disabled = false;
    execBtn.innerHTML = validCount > 0
      ? ('<i class="fas fa-upload"></i> ยืนยันนำเข้าข้อมูล (' + validCount + ' รายการ)')
      : '<i class="fas fa-upload"></i> ยืนยันนำเข้าข้อมูล';
  }
}

function executePmBatchImport(skipConfirm) {
  // หากผู้ใช้กดปุ่ม "ยืนยันนำเข้าข้อมูล" ทันทีหลังวางข้อความโดยยังไม่ได้กด Preview ให้รัน Preview อัตโนมัติทันที
  const pasteEl = document.getElementById('pmImportPasteArea');
  const rawText = pasteEl ? pasteEl.value.trim() : '';
  if (rawText && (!currentPmBatchImportData || currentPmBatchImportData.length === 0)) {
    handlePmImportPreview(true);
  }

  const validList = (currentPmBatchImportData || []).filter(function(x) { return x.isValid; });
  if (validList.length === 0) {
    if (!rawText) {
      showToast('กรุณาวางรายการแผน PM ในช่องข้อความ หรือกดปุ่ม "ทดสอบเติมข้อมูล PM 120 รายการ" ก่อนนำเข้า', 'warning');
      if (pasteEl) pasteEl.focus();
    } else {
      showToast('ไม่พบรหัสอุปกรณ์ TLM-... ที่ถูกต้องในข้อมูลที่วาง กรุณาตรวจสอบรูปแบบข้อมูล', 'error');
    }
    return;
  }

  const execBtn = document.getElementById('btnExecuteBatchImport');
  if (execBtn) {
    execBtn.disabled = true;
    execBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังนำเข้า ' + validList.length + ' รายการ...';
  }

  showLoading();
  const loadingText = document.querySelector('#loadingOverlay .loading-spinner p');
  const oldLoadingText = loadingText ? loadingText.textContent : 'กำลังดำเนินการ...';
  if (loadingText) loadingText.textContent = 'กำลังนำเข้าแผน PM จำนวน ' + validList.length + ' รายการลงระบบและชีต W/O...';

  const adminEmpId = currentUser ? currentUser.employeeId : 'TL186205';

  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (loadingText) loadingText.textContent = oldLoadingText;
      if (execBtn) {
        execBtn.disabled = false;
        execBtn.innerHTML = '<i class="fas fa-upload"></i> ยืนยันนำเข้าข้อมูล';
      }
      if (res && res.success) {
        showToast(res.message || ('นำเข้าแผนงาน PM สำเร็จ ' + validList.length + ' รายการ'), 'success');
        closeImportPmModal();

        // ปรับตัวกรองหน้า Dashboard PM ให้แสดงเดือน/ปีที่เพิ่งนำเข้าทั้งหมดทันที
        const statusFilterEl = document.getElementById('pmStatusFilter');
        if (statusFilterEl) statusFilterEl.value = '';
        const searchEl = document.getElementById('pmSearchInput');
        if (searchEl) searchEl.value = '';
        const monthFilterEl = document.getElementById('pmMonthFilter');
        if (monthFilterEl) monthFilterEl.value = '';
        const yearFilterEl = document.getElementById('pmYearFilter');
        if (yearFilterEl) yearFilterEl.value = '';

        if (res.requests && Array.isArray(res.requests) && res.requests.length > 0) {
          if (!allRequests) allRequests = [];
          window._recentlyCreatedRequests = window._recentlyCreatedRequests || [];
          const nowTs = Date.now();
          // ป้องกันการซ้ำและแทรกรายการใหม่ไว้ด้านบนสุด
          const existingUuids = new Set(allRequests.map(function(x) { return x.UUID; }));
          for (let i = res.requests.length - 1; i >= 0; i--) {
            const nr = res.requests[i];
            window._recentlyCreatedRequests.push({ req: nr, ts: nowTs });
            if (!existingUuids.has(nr.UUID)) {
              allRequests.unshift(nr);
            }
          }
          switchDashboardTab('pm');
          const statusFilterEl2 = document.getElementById('pmStatusFilter');
          if (statusFilterEl2) statusFilterEl2.value = '';
          const searchEl2 = document.getElementById('pmSearchInput');
          if (searchEl2) searchEl2.value = '';
          const monthFilterEl2 = document.getElementById('pmMonthFilter');
          if (monthFilterEl2) monthFilterEl2.value = '';
          const yearFilterEl2 = document.getElementById('pmYearFilter');
          if (yearFilterEl2) yearFilterEl2.value = '';
          recomputeAndUpdateCounts();
          filterPmTable();
        } else {
          loadDashboardData(true);
        }
      } else {
        showToast((res && res.message) ? res.message : 'เกิดข้อผิดพลาดในการนำเข้า', 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();

function resolvePmModelKey(eqCode, eqName) {
  const norm = (eqCode || '').toUpperCase().trim();
  if (EXACT_GSE_MODEL_MAP[norm]) return EXACT_GSE_MODEL_MAP[norm];
  const desc = (eqName || '').toUpperCase().trim();
  const parts = norm.split('-');
  const gseType = parts.length >= 2 ? parts[1] : '';

  if (gseType === 'TR') {
    const trCamelCodes = [
      'TLM-TR-026', 'TLM-TR-027', 'TLM-TR-028',
      'TLM-TR-029', 'TLM-TR-030', 'TLM-TR-031'
    ];
    if (trCamelCodes.indexOf(norm) !== -1 || desc.indexOf('CAMEL') !== -1 || desc.indexOf('CAM') !== -1) {
      return 'TR-CAM-804-TLM';
    }
    return 'TR-TLD-025-TLM';
  } else if (gseType === 'PU') {
    if (desc.indexOf('VIGO') !== -1) return 'PU-TYT-VIG-TLM';
    if (desc.indexOf('CARRY') !== -1 || desc.indexOf('SUZUKI') !== -1) return 'PU-SZK-CAR-TLM';
    return 'PU-TYT-REV-TLM';
  } else if (gseType === 'VA') {
    return 'VA-TYT-COM-TLM';
  } else if (gseType === 'VP') {
    if (desc.indexOf('INNOVA') !== -1) return 'VP-TYT-INN-TLM';
    return 'VP-TYT-AVA-TLM';
  } else if (gseType === 'TT') {
    return 'TT-ISZ-4JJ-TLM';
  } else if (gseType === 'TB') {
    return 'TB-VNS-VNS-TLM';
  } else if (gseType === 'PS') {
    if (desc.indexOf('TLD') !== -1 || norm.indexOf('404') !== -1) return 'PS-TLD-404-TLM';
    return 'PS-SAM-SAM-TLM';
  } else if (gseType === 'BC') {
    return 'BC-SAM-SAM-TLM';
  } else if (gseType === 'PW') {
    if (desc.indexOf('CAM') !== -1) return 'PW-CAM-4KH-TLM';
    return 'PW-ISZ-4KH-TLM';
  } else if (gseType === 'WT') {
    return 'WT-ISZ-4KH-TLM';
  } else if (gseType === 'LV') {
    if (desc.indexOf('CAM') !== -1) return 'LV-CAM-4KH-TLM';
    return 'LV-ISZ-4KH-TLM';
  } else if (gseType === 'AC') {
    if (desc.indexOf('140') !== -1 || desc.indexOf('MAK') !== -1) return 'AC-MAK-140-TLM';
    return 'AC-TLD-804-TLM';
  } else if (gseType === 'AS') {
    if (desc.indexOf('600') !== -1 || desc.indexOf('TLD') !== -1) return 'AS-TLD-600-TLM';
    if (desc.indexOf('300') !== -1) return 'AS-MAK-300-TLM';
    return 'AS-MAK-180-TLM';
  } else if (gseType === 'GP') {
    if (desc.indexOf('090') !== -1 || norm.indexOf('090') !== -1) return 'GP-MAK-090-TLM';
    if (desc.indexOf('140') !== -1 || norm.indexOf('140') !== -1) return 'GP-MAK-140-TLM';
    if (desc.indexOf('409') !== -1 || norm.indexOf('409') !== -1) return 'GP-409-E-CUP-TLM';
    return 'GP-MAK-090-TLM';
  } else if (gseType === 'CB') {
    return 'CB-TLD-NBL-TLM';
  } else if (gseType === 'BU') {
    return 'BU-SCA-SCA-TLM';
  } else if (gseType === 'PB') {
    return 'PB-TLD-150-TLM';
  } else if (gseType === 'FL') {
    return 'FL-TYT-TYT-TLM';
  } else if (gseType === 'MP') {
    if (desc.indexOf('REN') !== -1) return 'MP-REN-PER-TLM';
    return 'MP-ISZ-PER-TLM';
  } else if (gseType === 'N2') {
    return 'N2-SAM-SAM-TLM';
  } else if (gseType === 'ES') {
    return 'ES-SAM-SAM-TLM';
  } else if (gseType === 'GE') {
    return 'GE-HYD-HYD-TLM';
  }

  if (typeof PM_TASK_CARD_TEMPLATES !== 'undefined') {
    for (const k in PM_TASK_CARD_TEMPLATES) {
      if (PM_TASK_CARD_TEMPLATES[k].gseType === gseType) return k;
    }
  }
  return 'TR-TLD-025-TLM';
}

function normalizePmCheckLevel(checkLvl) {
  let clean = (checkLvl || 'A').toString().trim().toUpperCase();
  clean = clean.replace(/^PM\s+/, '').replace(/^CHECK\s+/, '').trim();
  const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  if (clean === 'MONTHLY' || clean === 'M' || months.indexOf(clean) !== -1) return 'A';
  if (clean === 'C' || clean.indexOf('CHECK C') !== -1) return 'C';
  if (clean === 'B' || clean.indexOf('CHECK B') !== -1) return 'B';
  return 'A';
}

function getPmDisplayCheckLabel(req) {
  const raw = (req.DamageAppearance || req.PmCheckLevel || 'Check A').toString().trim().toUpperCase();
  if (raw.indexOf('MONTHLY') !== -1) return 'MONTHLY';
  const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  for (let i = 0; i < months.length; i++) {
    if (raw === 'PM ' + months[i] || raw === months[i]) return 'MONTHLY (' + months[i] + ')';
  }
  return 'CHECK ' + normalizePmCheckLevel(raw);
}

function resolvePmTemplateKey(modelKey, checkLvl) {
  const lvl = normalizePmCheckLevel(checkLvl);
  if (modelKey === 'TR-CAM-804-TLM') {
    return 'TR-CAM-804-' + lvl + '-TLM';
  }
  if (modelKey === 'TR-TLD-025-TLM') {
    return 'TR-TLD-025-' + lvl + '-TLM';
  }
  const base = (modelKey || 'TR-TLD-025-TLM').replace(/-TLM$/, '');
  return base + '-' + lvl + '-TLM';
}

function isNonEngineGse(eqCode, modelKey) {
  const norm = (eqCode || '').toUpperCase().trim();
  const mk = (modelKey || '').toUpperCase().trim();
  if (norm.indexOf('TLM-TB-') === 0 || mk.indexOf('TB-') === 0 ||
      norm.indexOf('TLM-BC-') === 0 || mk.indexOf('BC-') === 0 ||
      norm.indexOf('TLM-ES-') === 0 || mk.indexOf('ES-') === 0 ||
      norm.indexOf('TLM-N2-') === 0 || mk.indexOf('N2-') === 0) {
    return true;
  }
  if ((norm.indexOf('TLM-PS-') === 0 && EXACT_GSE_MODEL_MAP[norm] !== 'PS-TLD-404-TLM') ||
      mk.indexOf('PS-SAM') === 0) {
    return true;
  }
  return false;
}

function normalizePmHrMeter(rawVal, eqCode, modelKey) {
  const s = (rawVal == null ? '' : String(rawVal)).trim();
  if (isNonEngineGse(eqCode, modelKey)) {
    if (!s || s === '-' || s === '0') return 'N/A';
    return s;
  }
  if (s === '-') return '';
  return s;
}

function getSerNoFromMaster(eqCode) {
  if (!eqCode || !equipmentMasterList || equipmentMasterList.length === 0) return '';
  const norm = eqCode.toString().toUpperCase().trim();
  const item = equipmentMasterList.find(function(x) {
    return (x.gseNo || '').toUpperCase().trim() === norm;
  });
  return item ? (item.serialNo || '') : '';
}

function openPmTaskCard(arg1, arg2, arg3) {
  try {
    let req = null;
    if (typeof arg1 === 'object' && arg1 !== null) {
      req = arg1;
    }
    const idx1 = (typeof arg1 === 'number') ? arg1 : (typeof arg1 === 'string' && /^\d+$/.test(arg1.trim()) ? parseInt(arg1.trim(), 10) : NaN);
    const idx3 = (typeof arg3 === 'number') ? arg3 : (typeof arg3 === 'string' && /^\d+$/.test(arg3.trim()) ? parseInt(arg3.trim(), 10) : NaN);
    if (!req && !isNaN(idx1) && window._pmRequestsList && window._pmRequestsList[idx1]) {
      req = window._pmRequestsList[idx1];
    } else if (!req && !isNaN(idx3) && window._pmRequestsList && window._pmRequestsList[idx3]) {
      req = window._pmRequestsList[idx3];
    }

    const id1 = (arg1 != null && typeof arg1 !== 'object') ? arg1.toString().trim() : '';
    const id2 = (arg2 != null && typeof arg2 !== 'object') ? arg2.toString().trim() : '';

    if (!req && window._pmRequestsMap) {
      req = (id1 && window._pmRequestsMap[id1]) || (id2 && window._pmRequestsMap[id2]);
    }
    if (!req && allRequests) {
      req = allRequests.find(function(r) {
        const u = (r.UUID || '').toString().trim();
        const rid = (r.RequestID || '').toString().trim();
        const wo = (r.WorkOrderNo || '').toString().trim();
        return (id1 && (u === id1 || rid === id1 || wo === id1)) ||
               (id2 && (u === id2 || rid === id2 || wo === id2));
      });
    }
    if (!req) {
      showToast('ไม่พบข้อมูลรายการ PM ในระบบ', 'error');
      return;
    }

    currentActivePmRequest = req;
    const modal = document.getElementById('pmTaskCardModal');
    if (!modal) {
      showToast('ไม่พบหน้าต่างบันทึก PM ในระบบ', 'error');
      return;
    }

    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';

    const checkLvl = req.PmCheckLevel || req.DamageAppearance || 'A';
    const cleanLvl = normalizePmCheckLevel(checkLvl);
    const displayCheckLabel = getPmDisplayCheckLabel(req);
    const modelKey = resolvePmModelKey(req.EquipmentCode, req.EquipmentName);

    // Parse PM Checklist Data
    let pmData = {};
    const rawJson = req.PmChecklistData || req.MaintenanceDetails;
    if (rawJson) {
      if (typeof rawJson === 'object') {
        pmData = rawJson;
      } else if (typeof rawJson === 'string' && rawJson.trim().indexOf('{') === 0) {
        try { pmData = JSON.parse(rawJson); } catch(e) {}
      }
    }

    // Rework Alert Box
    const reworkBox = document.getElementById('pmTcReworkAlert');
    const reworkTextEl = document.getElementById('pmTcReworkReasonText');
    const reworkReason = req.ReworkReason || pmData.reworkReason || '';
    if (reworkBox && reworkTextEl) {
      if (reworkReason && (req.Status === 'กำลังซ่อม' || req.Status === 'รอดำเนินการ')) {
        reworkTextEl.textContent = reworkReason;
        reworkBox.style.display = 'block';
      } else {
        reworkBox.style.display = 'none';
      }
    }

    // 1. Header Information & Badges
    try {
      const setVal = function(id, val) {
        const el = document.getElementById(id);
        if (el) el.value = (val != null) ? val : '';
      };
      const setTextVal = function(id, val) {
        const el = document.getElementById(id);
        if (el) el.textContent = (val != null) ? val : '-';
      };

      setVal('pmTcEqCode', req.EquipmentCode || '');
      setVal('pmTcChaNo', 'N/A');
      setVal('pmTcEngNo', 'N/A');

      let serNo = req.SerialNo || pmData.serialNo || '';
      if (!serNo) serNo = getSerNoFromMaster(req.EquipmentCode);
      setVal('pmTcSerNo', serNo || '-');

      setVal('pmTcWoNo', req.WorkOrderNo || pmData.workOrderNo || '');
      setTextVal('pmTcEqName', req.EquipmentName || '-');
      setTextVal('pmTcTargetDate', req.InformDate || req.TargetDate || '-');
      setTextVal('pmTcModelKey', modelKey + ' (' + displayCheckLabel + ')');

      const checkBadge = document.getElementById('pmTcCheckBadge');
      if (checkBadge) checkBadge.textContent = displayCheckLabel;

      const reqStatus = (req.Status || 'รอดำเนินการ').toString().trim();
      const statusBadge = document.getElementById('pmTcStatusBadge');
      if (statusBadge) {
        statusBadge.textContent = reqStatus;
        statusBadge.className = 'status-badge ' + getStatusClass(reqStatus);
      }
    } catch(errH) {
      console.error('Error populating PM header:', errH);
    }

    // 3. Hr/Meter & Date
    try {
      const hrEl = document.getElementById('pmTcHrKm');
      const rawHrVal = (pmData.hrMeter && pmData.hrMeter !== '-') ? pmData.hrMeter : ((pmData.hrKm && pmData.hrKm !== '-') ? pmData.hrKm : req.HrKm);
      if (hrEl) hrEl.value = normalizePmHrMeter(rawHrVal, req.EquipmentCode, modelKey);

      const now = new Date();
      const techDateEl = document.getElementById('pmTcTechDate');
      if (techDateEl) {
        techDateEl.value = toInputDateYYYYMMDD(pmData.completeDate || req.CompleteDate || req.TechnicianDate || now);
      }
      const techTimeEl = document.getElementById('pmTcTechTime');
      if (techTimeEl) {
        techTimeEl.value = toInputTimeHHMM(pmData.completeTime || req.CompleteTime || req.TechnicianTime || now);
      }
    } catch(errHr) {
      console.error('Error populating PM Hr/Date:', errHr);
    }

    // 4. Section B (Tools) & 5. Section C (Consumables)
    try {
      renderPmToolRows(pmData.sectionB, req.EquipmentCode, modelKey, cleanLvl);
      renderPmConsumableRows(pmData.sectionC, req.EquipmentCode, modelKey, cleanLvl);
      updatePmTaskCardBCModeUI(req.EquipmentCode, modelKey, cleanLvl, pmData);
    } catch(errBC) {
      console.error('Error in renderPmToolRows/Consumables:', errBC);
    }

    // 6. Section D (Checklist)
    try {
      renderPmChecklist(modelKey, cleanLvl, pmData.checklist || []);
    } catch(errChk) {
      console.error('Error in renderPmChecklist:', errChk);
    }

    // 7. Section E (Defect Found & Rectification)
    try {
      const defectFound = (pmData.defectFound || 'NO').toString().toUpperCase().trim();
      const radioYes = document.getElementById('pmDefectRadioYes');
      const radioNo = document.getElementById('pmDefectRadioNo');
      if (defectFound === 'YES' && radioYes) radioYes.checked = true;
      else if (radioNo) radioNo.checked = true;

      const rectEl = document.getElementById('pmTcRectification');
      if (rectEl) rectEl.value = pmData.rectification || '';
      handlePmDefectRadioChange();
    } catch(errDef) {
      console.error('Error in defect section:', errDef);
    }

    // 8. Materials Table
    try {
      renderPmMaterialRows(pmData.materials || []);
    } catch(errMat) {
      console.error('Error in renderPmMaterialRows:', errMat);
    }

    // 9. Section F (Technicians)
    try {
      populatePmTechnicianSelects(req, pmData);
    } catch(errTech) {
      console.error('Error in populatePmTechnicianSelects:', errTech);
    }

    // 10. Dual Signatures (Supervisor & Manager)
    try {
      populatePmDualSignatures(req, pmData);
    } catch(errSig) {
      console.error('Error in populatePmDualSignatures:', errSig);
    }

    // 11. Action Buttons & Field Permissions
    try {
      configurePmActionButtons(req);
    } catch(errBtn) {
      console.error('Error in configurePmActionButtons:', errBtn);
    }

  } catch(errMain) {
    console.error('Fatal error in openPmTaskCard:', errMain);
    showToast('เกิดข้อผิดพลาดในการเปิด Task Card: ' + errMain.message, 'error');
  }
}

function isTowbarGseOrModel(eqCode, modelKey) {

/**
 * ดึงค่าเริ่มต้นของหัวข้อ B (เครื่องมือ) และ C (วัสดุสิ้นเปลือง)
 * - สำหรับ Towbar (TB): มีค่ามาตรฐานล็อกไว้แล้ว
 * - สำหรับ Form รุ่นอื่นๆ ทั้งหมด (ยกเว้น TB): ดึงจากที่ User Admin ตั้งค่าไว้ใน PM_TASK_CARD_TEMPLATES (ถ้ายังไม่ได้ตั้งค่า จะคืนอาเรย์ว่าง [] เพื่อแสดงเป็น Shadow Placeholder ให้ช่างเห็นตัวอย่าง)
 */
function getAdminDefaultSectionBC(modelKey, cleanLvl, eqCode) {
  const mk = (modelKey || resolvePmModelKey(eqCode, '') || '').toUpperCase().trim();
  const lvl = normalizePmCheckLevel(cleanLvl || 'A');
  if (isTowbarGseOrModel(eqCode, mk)) {
    return {
      isTowbar: true,
      hasAdminDefaultB: true,
      hasAdminDefaultC: true,
      sectionB: [
        { ref: 'Combination Wrench', desc: 'ประแจแหวนข้างปากตาย' },
        { ref: 'Adjustable Wrench', desc: 'ประแจเลื่อน' },
        { ref: 'Pressure Gauge', desc: 'เกจวัดลมยาง' }
      ],
      sectionC: [
        { desc: 'Hydraulic oil', spec: 'SAE 68' },
        { desc: 'Grease', spec: 'Multi-Temp Grease' }
      ]
    };
  }

  let defaultB = [];
  let defaultC = [];
  if (typeof PM_TASK_CARD_TEMPLATES !== 'undefined' && PM_TASK_CARD_TEMPLATES[mk]) {
    const tpl = PM_TASK_CARD_TEMPLATES[mk];
    const chk = (tpl.checks && tpl.checks[lvl]) ? tpl.checks[lvl] : null;
    if (chk && Array.isArray(chk.defaultSectionB) && chk.defaultSectionB.length > 0) {
      defaultB = chk.defaultSectionB;
    } else if (Array.isArray(tpl.defaultSectionB) && tpl.defaultSectionB.length > 0) {
      defaultB = tpl.defaultSectionB;
    }
    if (chk && Array.isArray(chk.defaultSectionC) && chk.defaultSectionC.length > 0) {
      defaultC = chk.defaultSectionC;
    } else if (Array.isArray(tpl.defaultSectionC) && tpl.defaultSectionC.length > 0) {
      defaultC = tpl.defaultSectionC;
    }
  }

  return {
    isTowbar: false,
    hasAdminDefaultB: defaultB.length > 0,
    hasAdminDefaultC: defaultC.length > 0,
    sectionB: defaultB,
    sectionC: defaultC
  };
}
