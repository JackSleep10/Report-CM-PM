function populateTechDropdown(selectId, techs, selectedValue, defaultLabel) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  const label = defaultLabel || (selectId === 'tActionBy1' ? '-- เลือกช่างผู้รับผิดชอบหลัก --' : '-- ไม่มี / เลือกช่าง --');
  let html = '<option value="">' + escapeHtml(label) + '</option>';
  let found = false;
  (techs || []).forEach(function(t) {
    const isSel = (selectedValue && (selectedValue === t.employeeId || selectedValue === t.fullName)) ? 'selected' : '';
    if (isSel) found = true;
    html += '<option value="' + escapeAttr(t.employeeId) + '" ' + isSel + '>' +
            escapeHtml(t.employeeId + ' - ' + t.fullName) + '</option>';
  });
  if (selectedValue && !found) {
    html += '<option value="' + escapeAttr(selectedValue) + '" selected>' + escapeHtml(selectedValue) + '</option>';
  }
  sel.innerHTML = html;
}

/**
 * ตรวจจับการเปลี่ยนตัวเลือกช่าง และป้องกันไม่ให้เลือกช่างคนเดียวกันซ้ำข้ามช่อง
 */
function onTechSelectChange(changedSelectId) {
  const s1 = document.getElementById('tActionBy1');
  const s2 = document.getElementById('tActionBy2');
  const s3 = document.getElementById('tActionBy3');
  if (!s1 || !s2 || !s3) return;

  const val1 = s1.value.trim();
  const val2 = s2.value.trim();
  const val3 = s3.value.trim();

  const changedEl = document.getElementById(changedSelectId);
  const changedVal = changedEl ? changedEl.value.trim() : '';

  if (changedVal) {
    let duplicate = false;
    if (changedSelectId === 'tActionBy1' && (changedVal === val2 || changedVal === val3)) duplicate = true;
    if (changedSelectId === 'tActionBy2' && (changedVal === val1 || changedVal === val3)) duplicate = true;
    if (changedSelectId === 'tActionBy3' && (changedVal === val1 || changedVal === val2)) duplicate = true;

    if (duplicate) {
      showToast('รหัสพนักงานช่างนี้ถูกเลือกในช่องอื่นแล้ว ไม่สามารถเลือกซ้ำได้', 'warning');
      changedEl.value = '';
    }
  }

  refreshTechDropdowns();
}

/**
 * ปิดการเลือก (disable) รายชื่อช่างที่ถูกเลือกไปแล้วในช่องอื่น
 */
function refreshTechDropdowns() {
  const ids = ['tActionBy1', 'tActionBy2', 'tActionBy3'];
  const selects = ids.map(function(id) { return document.getElementById(id); });
  if (selects.some(function(s) { return !s; })) return;

  const values = selects.map(function(s) { return s.value.trim(); });

  selects.forEach(function(sel, index) {
    const otherValues = values.filter(function(v, i) { return i !== index && v !== ''; });
    Array.from(sel.options).forEach(function(opt) {
      if (!opt.value) {
        opt.disabled = false;
      } else {
        opt.disabled = otherValues.includes(opt.value);
      }
    });
  });
}

    if (dtNum) dtNum.textContent = idx + 1;

function handleSaveTechnicianReport() {
  const uuid = document.getElementById('techFormUUID').value;
  if (!uuid) {
    showToast('ไม่พบรหัสใบแจ้งซ่อม', 'error');
    return;
  }

  const maintenanceDetails = document.getElementById('tMaintenanceDetails').value.trim();
  const actualRepairTime = document.getElementById('tActualRepairTime').value.trim();
  const completeDate = document.getElementById('tCompleteDate').value;
  const completeTime = document.getElementById('tCompleteTime').value;
  const actionBy1 = document.getElementById('tActionBy1') ? document.getElementById('tActionBy1').value.trim() : '';
  const actionBy2 = document.getElementById('tActionBy2') ? document.getElementById('tActionBy2').value.trim() : '';
  const actionBy3 = document.getElementById('tActionBy3') ? document.getElementById('tActionBy3').value.trim() : '';

  if (!actionBy1) {
    showToast('กรุณาเลือกช่างผู้รับผิดชอบหลัก (คนที่ 1)', 'error');
    if (document.getElementById('tActionBy1')) document.getElementById('tActionBy1').focus();
    return;
  }

  // ป้องกันการเลือกช่างซ้ำกัน
  const selectedTechs = [actionBy1, actionBy2, actionBy3].filter(Boolean);
  const uniqueTechs = new Set(selectedTechs);
  if (uniqueTechs.size !== selectedTechs.length) {
    showToast('ไม่สามารถเลือกช่างผู้ปฏิบัติงานซ้ำกันได้ กรุณาตรวจสอบรายชื่อช่างคนที่ 1, 2 และ 3', 'error');
    return;
  }

  if (!maintenanceDetails) {
    showToast('กรุณาระบุรายละเอียดในการซ่อมบำรุง (ข้อ 2.1)', 'error');
    document.getElementById('tMaintenanceDetails').focus();
    return;
  }

  if (!actualRepairTime) {
    showToast('กรุณาระบุเวลาที่ใช้ซ่อมจริง (เช่น 2 ชม.)', 'error');
    document.getElementById('tActualRepairTime').focus();
    return;
  }

  if (!completeDate || !completeTime) {
    showToast('กรุณาระบุวันและเวลาที่แล้วเสร็จ', 'error');
    return;
  }

  // รวบรวมข้อมูลอะไหล่
  const rows = document.querySelectorAll('#sparePartsTbody tr');
  const spareParts = [];
  rows.forEach(function(tr) {
    const name = tr.querySelector('.sp-name').value.trim();
    const partNo = tr.querySelector('.sp-no').value.trim();
    const typeModel = tr.querySelector('.sp-type').value.trim();
    const qty = tr.querySelector('.sp-qty').value.trim();
    const price = tr.querySelector('.sp-price').value.trim();
    if (name || partNo || typeModel || qty || price) {
      spareParts.push({
        sparePartName: name,
        partNo: partNo,
        typeModel: typeModel,
        qty: qty,
        price: price
      });
    }
  });

  // กำหนดชื่อผู้ซ่อม/ผู้บันทึกผล (technicianName) ให้ตรงกับช่างหลักคนที่ 1 เสมอ
  let leadTechName = '';
  if (techniciansListCache && techniciansListCache.length > 0) {
    const matchedTech = techniciansListCache.find(function(t) { return t.employeeId === actionBy1; });
    if (matchedTech) leadTechName = matchedTech.fullName;
  }
  if (!leadTechName && currentUser && currentUser.employeeId === actionBy1) {
    leadTechName = currentUser.fullName;
  }
  if (!leadTechName) {
    leadTechName = actionBy1;
  }

  const techData = {
    maintenanceDetails: maintenanceDetails,
    actualRepairTime: actualRepairTime,
    completeDate: completeDate,
    completeTime: completeTime,
    actionBy1: actionBy1,
    actionBy2: actionBy2,
    actionBy3: actionBy3,
    technicianName: leadTechName,
    technicianEmpId: actionBy1,
    estimateDate: formatDateDMY(document.getElementById('tEstimateDate') ? document.getElementById('tEstimateDate').value : ''),
    estimateTime: document.getElementById('tEstimateTime') ? document.getElementById('tEstimateTime').value : '',
    spareParts: spareParts
  };

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        showToast(result.message, 'success');
        showPage('dashboardPage');
        loadDashboardData(true);
      } else {
        showToast(result.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    })
    .saveTechnicianReport(uuid, techData);
}

let heartbeatInterval = null;
let latestActiveUsersData = null;

function startHeartbeat() {
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  sendUserHeartbeat(); // ส่งทันทีครั้งแรก
  heartbeatInterval = setInterval(sendUserHeartbeat, 45000); // ส่งซ้ำทุกๆ 45 วินาที
}

function stopHeartbeat() {
  if (heartbeatInterval) {
    clearInterval(heartbeatInterval);
    heartbeatInterval = null;
  }
}

function sendUserHeartbeat() {
  if (!currentUser || !currentUser.employeeId) return;

  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
  const payload = {
    employeeId: currentUser.employeeId,
    fullName: currentUser.fullName || '',
    role: (currentUser.role || 'user').toLowerCase(),
    deviceType: isMobile ? 'Mobile' : 'Desktop',
    currentTab: (typeof currentDashboardTab !== 'undefined' ? currentDashboardTab : 'requests')
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        updateActiveUsersUI(res);
      }
    })
    .withFailureHandler(function(err) {
      console.warn('Heartbeat ping failed:', err);
    })
    .recordUserHeartbeat(payload);
}

function updateActiveUsersUI(res) {
  if (!res) return;
  const count = res.activeCount || 1;
  const navCountEl = document.getElementById('navActiveUsersCount');
  if (navCountEl) {
    navCountEl.textContent = count + ' ออนไลน์';
  }
  const tbCountEl = document.getElementById('toolbarActiveCount');
  if (tbCountEl) {
    tbCountEl.textContent = 'ออนไลน์ ' + count + ' คน';
  }

  if (res.activeUsers) {
    latestActiveUsersData = res.activeUsers;
    const modal = document.getElementById('activeUsersModal');
    if (modal && modal.style.display !== 'none') {
      renderActiveUsersModalContent(res.activeUsers, count);
    }
  }
}

function renderActiveUsersModalContent(users, totalCount) {
  const usersList = users || [];
  let mobileCount = 0;
  let desktopCount = 0;

  usersList.forEach(function(u) {
    if (u.deviceType === 'Mobile') mobileCount++;
    else desktopCount++;
  });

  const elTotal = document.getElementById('modalActiveTotal');
  if (elTotal) elTotal.textContent = totalCount || usersList.length;

  const elMobile = document.getElementById('modalActiveMobile');
  if (elMobile) elMobile.textContent = mobileCount;

  const elDesktop = document.getElementById('modalActiveDesktop');
  if (elDesktop) elDesktop.textContent = desktopCount;

  const tbody = document.getElementById('activeUsersTbody');
  if (!tbody) return;

  if (usersList.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:16px; color:#94A3B8;">ไม่มีข้อมูลผู้ใช้งานที่เชื่อมต่อขณะนี้</td></tr>';
    return;
  }

  let html = '';
  const now = Date.now();
  usersList.forEach(function(u) {
    const isMe = currentUser && String(u.employeeId).toUpperCase() === String(currentUser.employeeId).toUpperCase();
    const roleUpper = (u.role || 'user').toUpperCase();
    const deviceIcon = u.deviceType === 'Mobile' ? '<i class="fas fa-mobile-alt" style="color:#2563EB;"></i> มือถือ' : '<i class="fas fa-desktop" style="color:#059669;"></i> คอมพิวเตอร์';
    const secondsAgo = Math.max(0, Math.floor((now - (u.lastPing || now)) / 1000));
    let timeAgoText = secondsAgo < 15 ? 'ใช้งานอยู่ขณะนี้' : (secondsAgo + ' วิ ที่แล้ว');

    html += '<tr style="border-bottom:1px solid #F1F5F9; ' + (isMe ? 'background:#F0FDF4;' : '') + '">';
    html += '<td style="padding:10px 12px;">' +
              '<strong>' + escapeHtml(u.fullName || u.employeeId) + '</strong>' +
              (isMe ? ' <span style="font-size:0.7rem; background:#DCFCE7; color:#15803D; padding:1px 6px; border-radius:10px; font-weight:700;">(คุณ)</span>' : '') +
              '<div style="font-size:0.75rem; color:#64748B;">รหัส: ' + escapeHtml(u.employeeId) + '</div>' +
            '</td>';
    html += '<td style="padding:10px 12px;"><span style="font-size:0.75rem; font-weight:600; background:#E2E8F0; padding:2px 8px; border-radius:10px; color:#334155;">' + escapeHtml(roleUpper) + '</span></td>';
    html += '<td style="padding:10px 12px; text-align:center; font-size:0.82rem;">' + deviceIcon + '</td>';
    html += '<td style="padding:10px 12px; text-align:right;">' +
              '<span style="display:inline-flex; align-items:center; gap:5px; font-size:0.78rem; color:#16A34A; font-weight:600;">' +
                '<span class="active-pulse-dot" style="width:6px; height:6px;"></span> ' + timeAgoText +
              '</span>' +
            '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;
}

let currentPmStatusFilter = '';
let currentPmBatchImportData = [];
let currentActivePmRequest = null;
let currentActivePmTemplate = null;
let currentPmChecklistState = [];

function filterPmStatus(status) {
  currentPmStatusFilter = status;
  const select = document.getElementById('pmStatusFilter');
  if (select) select.value = status;
  filterPmTable();
}

function filterPmTable() {
  const searchEl = document.getElementById('pmSearchInput');
  const searchTerm = searchEl ? searchEl.value.toLowerCase().trim() : '';
  const statusEl = document.getElementById('pmStatusFilter');
  const statusFilter = statusEl ? statusEl.value : '';
  const monthEl = document.getElementById('pmMonthFilter');
  const monthFilter = monthEl ? monthEl.value : '';
  const yearEl = document.getElementById('pmYearFilter');
  const yearFilter = yearEl ? yearEl.value : '';

  let filtered = (allRequests || []).filter(function(r) {
    return isPmRequest(r);
  });

  if (statusFilter) {
    filtered = filtered.filter(function(r) {
      const st = (r.Status || 'รอดำเนินการ').toString().trim();
      if (statusFilter === 'COMPLETE') return st === 'COMPLETE';
      if (statusFilter === 'เสร็จสิ้น') return st === 'เสร็จสิ้น' || st === 'เสร็จสิ้น (Return to Service)' || st === 'COMPLETE';
      if (statusFilter === 'รอตรวจสอบ') return st === 'รอ Supervisor ตรวจสอบ' || st === 'รอ Manager อนุมัติ' || st === 'รอตรวจสอบ';
      if (statusFilter === 'กำลังซ่อม') return st === 'กำลังซ่อม' || st === 'กำลังทำ PM' || st === 'IN PROGRESS';
      if (statusFilter === 'รอดำเนินการ') return st === 'รอดำเนินการ' || st === 'DRAFT' || st === 'PENDING';
      return st === statusFilter;
    });
  }

  if (monthFilter) {
    const targetMonth = parseInt(monthFilter, 10);
    filtered = filtered.filter(function(r) {
      const d = r.InformDate || r.TargetDate || '';
      if (!d) return false;
      const parts = d.toString().split(/[\/\-]/);
      if (parts.length >= 3) {
        let m = -1;
        if (parts[0].length === 4) m = parseInt(parts[1], 10); // YYYY-MM-DD
        else m = parseInt(parts[1], 10); // DD/MM/YYYY
        return m === targetMonth;
      }
      return false;
    });
  }

  if (yearFilter) {
    const targetYear = parseInt(yearFilter, 10);
    filtered = filtered.filter(function(r) {
      const d = r.InformDate || r.TargetDate || '';
      if (!d) return false;
      const parts = d.toString().split(/[\/\-]/);
      if (parts.length >= 3) {
        let y = -1;
        if (parts[0].length === 4) y = parseInt(parts[0], 10);
        else y = parseInt(parts[2], 10);
        return y === targetYear;
      }
      return false;
    });
  }

  if (searchTerm) {
    filtered = filtered.filter(function(r) {
      return (r.RequestID || '').toString().toLowerCase().indexOf(searchTerm) !== -1 ||
             (r.WorkOrderNo || '').toString().toLowerCase().indexOf(searchTerm) !== -1 ||
             (r.EquipmentCode || '').toString().toLowerCase().indexOf(searchTerm) !== -1 ||
             (r.EquipmentName || '').toString().toLowerCase().indexOf(searchTerm) !== -1 ||
             (r.DamageAppearance || '').toString().toLowerCase().indexOf(searchTerm) !== -1 ||
             (r.PmCheckLevel || '').toString().toLowerCase().indexOf(searchTerm) !== -1;
    });
  }

  renderPmTable(filtered);
}

  recomputeAndUpdateCounts();
  filterPmTable();
}

function renderPmTable(pmRequests) {
  const tbody = document.getElementById('pmTableBody');
  if (!tbody) return;

  if (!pmRequests || pmRequests.length === 0) {
    tbody.innerHTML = '<tr class="tr-empty"><td colspan="10" class="empty-message">' +
      '<i class="fas fa-calendar-check"></i><p>ไม่มีข้อมูลแผนบำรุงรักษา (PM) ตรงตามเงื่อนไข</p></td></tr>';
    return;
  }

  const userRole = (currentUser ? (currentUser.role || 'user') : 'user').toLowerCase();
  const isAdmin = userRole === 'admin';
  const isSup = userRole === 'supervisor';
  const isMgr = userRole === 'manager';

  window._pmRequestsMap = window._pmRequestsMap || {};
  window._pmRequestsList = pmRequests || [];

  let html = '';
  pmRequests.forEach(function(r, index) {
    const reqStatus = (r.Status || 'รอดำเนินการ').toString().trim();
    let badgeClass = 'status-pending';
    if (reqStatus === 'กำลังซ่อม') badgeClass = 'status-progress';
    else if (reqStatus === 'รอ Supervisor ตรวจสอบ') badgeClass = 'status-supervisor';
    else if (reqStatus === 'รอ Manager อนุมัติ') badgeClass = 'status-manager';
    else if (reqStatus === 'COMPLETE') badgeClass = 'status-complete';
    else if (reqStatus === 'เสร็จสิ้น' || reqStatus === 'เสร็จสิ้น (Return to Service)') badgeClass = 'status-completed';

    const checkLevelText = r.PmCheckLevel || r.DamageAppearance || 'Check A';
    const targetDateText = r.InformDate || r.TargetDate || '-';
    const techName = r.TechnicianName || r.ActionBy1 || '-';
    const woDisplay = r.WorkOrderNo ? '<span class="badge-wo">' + escapeHtml(r.WorkOrderNo) + '</span>' : '<span style="color:#94A3B8;">-</span>';

    const rUuid = (r.UUID || '').toString().trim();
    const rReqId = (r.RequestID || '').toString().trim();
    if (rUuid) window._pmRequestsMap[rUuid] = r;
    if (rReqId) window._pmRequestsMap[rReqId] = r;

    html += '<tr>';
    html += '<td style="text-align: center; color: #94A3B8;">' + (index + 1) + '</td>';
    html += '<td style="font-weight: 700; color: #2563EB;">' + escapeHtml(r.RequestID || '') + '</td>';
    html += '<td>' + woDisplay + '</td>';

    html += '<td><span class="pm-tc-badge">' + escapeHtml(checkLevelText) + '</span></td>';

    const canSupervisorApprove = (isAdmin || isSup) && reqStatus === 'รอ Supervisor ตรวจสอบ';

    html += '<td class="col-actions"><div class="actions-cell">';

    // 1. ปุ่มพิมพ์ Task Card (เขียว เหมือน CM)
    html += '<button class="btn btn-icon btn-print" title="พิมพ์ใบ Task Card (A4)" onclick="event.stopPropagation(); handlePmPrintRow(' + index + ', \'' + escapeAttr(rUuid) + '\', \'' + escapeAttr(rReqId) + '\')">' +
            '<i class="fas fa-print"></i></button>';

    // 2. ปุ่ม Supervisor ตรวจสอบ (เหลือง/ส้ม เหมือน CM)
    if (canSupervisorApprove) {
      html += '<button class="btn btn-icon btn-supervisor" title="ตรวจสอบงาน PM (Supervisor)" onclick="event.stopPropagation(); handlePmOpenCardRow(' + index + ', \'' + escapeAttr(rUuid) + '\', \'' + escapeAttr(rReqId) + '\')">' +
              '<i class="fas fa-clipboard-check"></i></button>';
    }

    // 3. ปุ่ม Manager อนุมัติ (ม่วง เหมือน CM)
    if (canManagerApprove) {
      html += '<button class="btn btn-icon btn-manager" title="อนุมัติงาน PM (Manager)" onclick="event.stopPropagation(); handlePmOpenCardRow(' + index + ', \'' + escapeAttr(rUuid) + '\', \'' + escapeAttr(rReqId) + '\')">' +
              '<i class="fas fa-stamp"></i></button>';
    }

    // 4. ปุ่ม Digital Task Card (ฟ้าคราม PM สดใส สวยงาม ต่างจาก CM)
    html += '<button class="btn btn-icon btn-pm-card" title="เปิดบันทึก/ดูผล Task Card" onclick="event.stopPropagation(); handlePmOpenCardRow(' + index + ', \'' + escapeAttr(rUuid) + '\', \'' + escapeAttr(rReqId) + '\')">' +
            '<i class="fas fa-calendar-check"></i></button>';

    // 5. ปุ่ม Admin ปิดงานในระบบและ Sheet (เมื่อ COMPLETE)
    if (isAdmin && reqStatus === 'COMPLETE') {
      html += '<button class="btn btn-icon btn-close-wo" title="Admin: ปิดงานในระบบและ Sheet W/O (CLOSED)" onclick="event.stopPropagation(); handlePmAdminDirectCloseRow(' + index + ', \'' + escapeAttr(rUuid) + '\')">' +
              '<i class="fas fa-folder-minus"></i></button>';
    } else if (isAdmin && (reqStatus === 'เสร็จสิ้น' || reqStatus === 'เสร็จสิ้น (Return to Service)')) {
      html += '<button class="btn btn-icon btn-wo-closed" title="ปิดงานแล้ว (CLOSED)" disabled>' +
              '<i class="fas fa-check-circle"></i></button>';
    }

    // 6. ปุ่ม Admin ลบ (แดง เหมือน CM)
    if (isAdmin) {
      html += '<button class="btn btn-icon btn-delete" title="ลบรายการ PM" onclick="event.stopPropagation(); handleDeletePmRow(' + index + ', \'' + escapeAttr(rUuid) + '\', \'' + escapeAttr(rReqId) + '\', \'' + escapeAttr(r.EquipmentCode || '') + '\')">' +
              '<i class="fas fa-trash"></i></button>';
    }

    html += '</div></td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;
}

function openCreatePmModal() {

  if (!modal) return;

  if (form) form.reset();
  const today = new Date().toISOString().split('T')[0];
  const dateInput = document.getElementById('pmCreateTargetDate');
  if (dateInput) dateInput.value = today;
  const feedbackEl = document.getElementById('pmCreateEqFeedback');
  if (feedbackEl) feedbackEl.innerHTML = '';
  modal.style.display = 'flex';
}

function closeCreatePmModal() {
  const modal = document.getElementById('pmCreateModal');
  if (modal) modal.style.display = 'none';
}

function handlePmCodeInput(rawCode) {
  const code = (rawCode || '').toUpperCase().trim();
  const feedbackEl = document.getElementById('pmCreateEqFeedback');
  const nameEl = document.getElementById('pmCreateEqName');
  if (!feedbackEl) return;

  if (!code) {
    feedbackEl.innerHTML = '';
    return;
  }

  if (equipmentMasterList && equipmentMasterList.length > 0) {
    const item = equipmentMasterList.find(function(x) {
      return (x.gseNo || '').toUpperCase().trim() === code;
    });

    if (item) {
      feedbackEl.innerHTML = '<span style="color:#16A34A;"><i class="fas fa-check-circle"></i> ' + escapeHtml(item.description || item.gseNo) + '</span>';
      if (nameEl) nameEl.value = item.description || '';
    } else {
      feedbackEl.innerHTML = '<span style="color:#DC2626;"><i class="fas fa-exclamation-triangle"></i> ไม่พบรหัส ' + escapeHtml(code) + ' ในระบบ GSE MASTER</span>';
    }
  } else {
    loadEquipmentMaster(function() {
      handlePmCodeInput(rawCode);
    });
  }
}

function handleSavePmRequest() {
  const code = (document.getElementById('pmCreateEqCode').value || '').toUpperCase().trim();
  const name = document.getElementById('pmCreateEqName').value.trim();
  const checkLevel = document.getElementById('pmCreateCheckLevel').value;
  const targetDate = document.getElementById('pmCreateTargetDate').value;
  const notes = document.getElementById('pmCreateNotes').value.trim();

  if (!code) {
    showToast('กรุณาระบุรหัสอุปกรณ์ (Equipment Code)', 'error');
    return;
  }
  if (!targetDate) {
    showToast('กรุณาระบุกำหนดการเข้าตรวจ (Target Date)', 'error');
    return;
  }

  // Validate against GSE Master
  if (equipmentMasterList && equipmentMasterList.length > 0) {
    const valid = equipmentMasterList.some(function(x) {
      return (x.gseNo || '').toUpperCase().trim() === code;
    });
    if (!valid) {
      if (!confirm('คำเตือน: รหัสอุปกรณ์ "' + code + '" ไม่พบใน GSE MASTER คุณต้องการดำเนินการต่อหรือไม่?')) {
        return;
      }
    }
  }

  showLoading();
  const pmData = {
    equipmentCode: code,
    equipmentName: name || code,
    checkLevel: checkLevel,
    targetDate: targetDate,
    planDate: targetDate,
    notes: notes
  };

  const adminEmpId = currentUser ? currentUser.employeeId : '';

  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res && res.success) {
        showToast(res.message || 'สร้างรายการ PM สำเร็จ', 'success');
        closeCreatePmModal();
        if (res.request) {
          if (!allRequests) allRequests = [];
          const existIdx = allRequests.findIndex(function(x) { return x.UUID === res.request.UUID; });
          if (existIdx >= 0) allRequests[existIdx] = res.request;
          else allRequests.unshift(res.request);

          recomputeAndUpdateCounts();
          if (currentDashboardTab === 'pm') {
            filterPmTable();
          } else {
            filterTable();
          }
        } else {
          loadDashboardData(true);
        }
      } else {
        showToast((res && res.message) ? res.message : 'เกิดข้อผิดพลาดในการสร้าง PM', 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('เกิดข้อผิดพลาด: ' + (err.message || err), 'error');
    })
    .createPmRequest(pmData, adminEmpId);
}

  document.getElementById('pmImportMonth').value = (now.getMonth() + 1).toString();

  modal.style.display = 'flex';
}

function closeImportPmModal() {
  const modal = document.getElementById('pmImportModal');
  if (modal) modal.style.display = 'none';
}

function handlePmImportPreview() {
  const rawText = document.getElementById('pmImportPasteArea').value.trim();
  if (!rawText) {
    showToast('กรุณาวางข้อมูลจาก Excel หรือระบุรายการที่ต้องการนำเข้า', 'warning');
    return;
  }

  const defaultMonth = document.getElementById('pmImportMonth').value;
  const defaultYear = document.getElementById('pmImportYear').value;

  const lines = rawText.split('\n');
  currentPmBatchImportData = [];

  let validCount = 0;
  let invalidCount = 0;
  let html = '';

  lines.forEach(function(line, idx) {
    const trimmed = line.trim();
    if (!trimmed) return;

    const parts = trimmed.split(/[\t,;]+/);
    const code = (parts[0] || '').toUpperCase().trim();
    let checkLvl = (parts[1] || 'Check A').trim();
    let targetDate = (parts[2] || '').trim();

    if (!targetDate) {
      targetDate = defaultYear + '-' + (defaultMonth.length === 1 ? '0' + defaultMonth : defaultMonth) + '-01';
    }

    let isValid = false;
    let eqDesc = '';
    if (equipmentMasterList && equipmentMasterList.length > 0) {
      const match = equipmentMasterList.find(function(x) {
        return (x.gseNo || '').toUpperCase().trim() === code;
      });
      if (match) {
        isValid = true;
        eqDesc = match.description || '';
      }
    } else {
      isValid = code.indexOf('TLM-') === 0;
    }

    if (isValid) validCount++;
    else invalidCount++;

    currentPmBatchImportData.push({
      equipmentCode: code,
      equipmentName: eqDesc || code,
      checkLevel: checkLvl,
      targetDate: targetDate,
      isValid: isValid
    });

    const statusBadge = isValid
      ? '<span style="color:#16A34A; font-weight:700;"><i class="fas fa-check-circle"></i> พร้อมนำเข้า</span>'
      : '<span style="color:#DC2626; font-weight:700;"><i class="fas fa-times-circle"></i> ไม่พบใน GSE MASTER</span>';

    html += '<tr style="background:' + (isValid ? '#FFFFFF' : '#FEF2F2') + ';">';
    html += '<td style="padding:6px 10px; text-align:center;">' + (currentPmBatchImportData.length) + '</td>';
    html += '<td style="padding:6px 10px; font-weight:700; color:' + (isValid ? '#1E293B' : '#DC2626') + ';">' + escapeHtml(code) + '</td>';
    html += '<td style="padding:6px 10px;">' + escapeHtml(eqDesc || '-') + '</td>';
    html += '<td style="padding:6px 10px; text-align:center;"><span class="pm-tc-badge">' + escapeHtml(checkLvl) + '</span></td>';
    html += '<td style="padding:6px 10px; text-align:center;">' + escapeHtml(targetDate) + '</td>';
    html += '<td style="padding:6px 10px; text-align:center;">' + statusBadge + '</td>';
    html += '</tr>';
  });

  const wrapper = document.getElementById('pmImportPreviewWrapper');
  wrapper.style.display = 'block';
  document.getElementById('pmImportPreviewTbody').innerHTML = html;

  const summary = document.getElementById('pmImportSummaryBadge');
  summary.innerHTML = '<span style="color:#16A34A;">พร้อมนำเข้า ' + validCount + ' รายการ</span>' +
    (invalidCount > 0 ? ' | <span style="color:#DC2626;">ไม่ผ่าน ' + invalidCount + ' รายการ</span>' : '');

  document.getElementById('btnExecuteBatchImport').disabled = (validCount === 0);
}

function executePmBatchImport() {
  const validList = currentPmBatchImportData.filter(function(x) { return x.isValid; });
  if (validList.length === 0) {
    showToast('ไม่มีรายการที่ผ่านการตรวจสอบ', 'error');

  }

  if (!confirm('ยืนยันการนำเข้าแผนงาน PM จำนวน ' + validList.length + ' รายการ?')) return;

  google.script.run
    .withSuccessHandler(function(res) {

      if (res && res.success) {
        showToast(res.message || 'นำเข้าแผนงาน PM เรียบร้อยแล้ว', 'success');

      showToast('เกิดข้อผิดพลาด: ' + (err.message || err), 'error');
    })
    .importPmMonthlyPlan(validList, adminEmpId);
}

let currentPmChecklistItems = [];
let pmPrintCurrentScale = 1.0;
const PM_PRINT_BASE_W = 794;

/**
 * 4. แมปปิ้งรถแทรกเตอร์ตามคำสั่งผู้ใช้งาน:
 * - 6 คัน CAMEL (TLM-TR-026 ถึง TLM-TR-031) -> TR-CAM-804-TLM
 * - 26 คัน TLD (TLM-TR-001, 006, 010, 018, 019, 025, 049 ถึง 068) -> TR-TLD-025-TLM
 */
function resolvePmModelKey(eqCode, eqName) {
  const norm = (eqCode || '').toUpperCase().trim();
  const desc = (eqName || '').toUpperCase().trim();
  const parts = norm.split('-');
  const gseType = parts.length >= 2 ? parts[1] : '';

  if (gseType === 'TR') {
    const trCamelCodes = [
      'TLM-TR-026', 'TLM-TR-027', 'TLM-TR-028',
      'TLM-TR-029', 'TLM-TR-030', 'TLM-TR-031'
    ];
    if (trCamelCodes.indexOf(norm) !== -1 || desc.indexOf('CAMEL') !== -1 || desc.indexOf('CAM') !== -1) {
      return 'TR-CAM-804-TLM';
    }
    return 'TR-TLD-025-TLM';
  } else if (gseType === 'PU') {
    if (desc.indexOf('VIGO') !== -1) return 'PU-TYT-VIG-TLM';
    if (desc.indexOf('CARRY') !== -1 || desc.indexOf('SUZUKI') !== -1) return 'PU-SZK-CAR-TLM';
    return 'PU-TYT-REV-TLM';
  } else if (gseType === 'VA') {
    return 'VA-TYT-COM-TLM';
  } else if (gseType === 'VP') {
    if (desc.indexOf('INNOVA') !== -1) return 'VP-TYT-INN-TLM';
    return 'VP-TYT-AVA-TLM';
  } else if (gseType === 'TT') {
    return 'TT-ISZ-4JJ-TLM';
  } else if (gseType === 'TB') {
    return 'TB-VNS-VNS-TLM';
  } else if (gseType === 'PS') {
    if (desc.indexOf('TLD') !== -1 || norm.indexOf('404') !== -1) return 'PS-TLD-404-TLM';
    return 'PS-SAM-SAM-TLM';
  } else if (gseType === 'BC') {
    return 'BC-SAM-SAM-TLM';
  } else if (gseType === 'PW') {
    if (desc.indexOf('CAM') !== -1) return 'PW-CAM-4KH-TLM';
    return 'PW-ISZ-4KH-TLM';
  } else if (gseType === 'WT') {
    return 'WT-ISZ-4KH-TLM';
  } else if (gseType === 'LV') {
    if (desc.indexOf('CAM') !== -1) return 'LV-CAM-4KH-TLM';
    return 'LV-ISZ-4KH-TLM';
  } else if (gseType === 'AC') {
    if (desc.indexOf('140') !== -1 || desc.indexOf('MAK') !== -1) return 'AC-MAK-140-TLM';
    return 'AC-TLD-804-TLM';
  } else if (gseType === 'AS') {
    if (desc.indexOf('600') !== -1 || desc.indexOf('TLD') !== -1) return 'AS-TLD-600-TLM';
    if (desc.indexOf('300') !== -1) return 'AS-MAK-300-TLM';
    return 'AS-MAK-180-TLM';
  } else if (gseType === 'GP') {
    if (desc.indexOf('090') !== -1 || norm.indexOf('090') !== -1) return 'GP-MAK-090-TLM';
    if (desc.indexOf('140') !== -1 || norm.indexOf('140') !== -1) return 'GP-MAK-140-TLM';
    if (desc.indexOf('409') !== -1 || norm.indexOf('409') !== -1) return 'GP-409-E-CUP-TLM';
    return 'GP-MAK-090-TLM';
  } else if (gseType === 'CB') {
    return 'CB-TLD-NBL-TLM';
  } else if (gseType === 'BU') {
    return 'BU-SCA-SCA-TLM';
  } else if (gseType === 'PB') {
    return 'PB-TLD-150-TLM';
  } else if (gseType === 'FL') {
    return 'FL-TYT-TYT-TLM';
  } else if (gseType === 'MP') {
    if (desc.indexOf('REN') !== -1) return 'MP-REN-PER-TLM';
    return 'MP-ISZ-PER-TLM';
  } else if (gseType === 'N2') {
    return 'N2-SAM-SAM-TLM';
  } else if (gseType === 'ES') {
    return 'ES-SAM-SAM-TLM';
  } else if (gseType === 'GE') {
    return 'GE-HYD-HYD-TLM';
  }

  // Fallback: หากลุ่มรหัสในแม่แบบ 36 รุ่น
  if (typeof PM_TASK_CARD_TEMPLATES !== 'undefined') {
    for (const k in PM_TASK_CARD_TEMPLATES) {
      if (PM_TASK_CARD_TEMPLATES[k].gseType === gseType) return k;
    }
  }
  return 'TR-TLD-025-TLM';
}

function normalizePmCheckLevel(checkLvl) {
  let clean = (checkLvl || 'A').toString().trim().toUpperCase();
  clean = clean.replace(/^PM\s+/, '').replace(/^CHECK\s+/, '').trim();
  if (clean.indexOf('C') !== -1 && clean !== 'CHECK') return 'C';
  if (clean.indexOf('B') !== -1) return 'B';
  return 'A';
}

function resolvePmTemplateKey(modelKey, checkLvl) {
  const lvl = normalizePmCheckLevel(checkLvl);
  if (modelKey === 'TR-CAM-804-TLM') {
    return 'TR-CAM-804-' + lvl + '-TLM';
  }
  if (modelKey === 'TR-TLD-025-TLM') {
    if (lvl === 'A') return 'TR-TLD-025-A-TLM';
    return 'TR-TLD-025-' + lvl + '-TLM';
  }
  const base = (modelKey || 'TR-TLD-025-TLM').replace(/-TLM$/, '');
  return base + '-' + lvl + '-TLM';
}

function getSerNoFromMaster(eqCode) {
  if (!eqCode || !equipmentMasterList || equipmentMasterList.length === 0) return '';
  const norm = eqCode.toString().toUpperCase().trim();
  const item = equipmentMasterList.find(function(x) {
    return (x.gseNo || '').toUpperCase().trim() === norm;
  });
  return item ? (item.serialNo || '') : '';
}

function openPmTaskCard(arg1, arg2, arg3) {
  try {
    let req = null;
    if (typeof arg1 === 'object' && arg1 !== null) {
      req = arg1;
    }
    const idx1 = (typeof arg1 === 'number') ? arg1 : (typeof arg1 === 'string' && /^\d+$/.test(arg1.trim()) ? parseInt(arg1.trim(), 10) : NaN);
    const idx3 = (typeof arg3 === 'number') ? arg3 : (typeof arg3 === 'string' && /^\d+$/.test(arg3.trim()) ? parseInt(arg3.trim(), 10) : NaN);
    if (!req && !isNaN(idx1) && window._pmRequestsList && window._pmRequestsList[idx1]) {
      req = window._pmRequestsList[idx1];
    } else if (!req && !isNaN(idx3) && window._pmRequestsList && window._pmRequestsList[idx3]) {
      req = window._pmRequestsList[idx3];
    }

    const id1 = (arg1 != null && typeof arg1 !== 'object') ? arg1.toString().trim() : '';
    const id2 = (arg2 != null && typeof arg2 !== 'object') ? arg2.toString().trim() : '';

    if (!req && window._pmRequestsMap) {
      req = (id1 && window._pmRequestsMap[id1]) || (id2 && window._pmRequestsMap[id2]);
    }
    if (!req && allRequests) {
      req = allRequests.find(function(r) {
        const u = (r.UUID || '').toString().trim();
        const rid = (r.RequestID || '').toString().trim();
        const wo = (r.WorkOrderNo || '').toString().trim();
        return (id1 && (u === id1 || rid === id1 || wo === id1)) ||
               (id2 && (u === id2 || rid === id2 || wo === id2));
      });
    }
    if (!req) {
      showToast('ไม่พบข้อมูลรายการ PM ในระบบ', 'error');
      return;
    }

    currentActivePmRequest = req;
    const modal = document.getElementById('pmTaskCardModal');
    if (!modal) {
      showToast('ไม่พบหน้าต่างบันทึก PM ในระบบ', 'error');
      return;
    }

    // เปิดหน้าต่าง Modal ทันทีเพื่อให้ผู้ใช้เห็นว่าระบบตอบสนอง 100%
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';

    const checkLvl = req.PmCheckLevel || req.DamageAppearance || 'A';
    const cleanLvl = normalizePmCheckLevel(checkLvl);
    const modelKey = resolvePmModelKey(req.EquipmentCode, req.EquipmentName);

    // 1. Header Information & Badges
    try {
      const setVal = function(id, val) {
        const el = document.getElementById(id);
        if (el) el.value = (val != null) ? val : '';
      };
      const setTextVal = function(id, val) {
        const el = document.getElementById(id);
        if (el) el.textContent = (val != null) ? val : '-';
      };

      setVal('pmTcEqCode', req.EquipmentCode || '');
      setVal('pmTcChaNo', 'N/A');
      setVal('pmTcEngNo', 'N/A');

      let serNo = req.SerialNo || '';
      if (!serNo) serNo = getSerNoFromMaster(req.EquipmentCode);
      setVal('pmTcSerNo', serNo || '-');

      setVal('pmTcWoNo', req.WorkOrderNo || '-');
      setTextVal('pmTcEqName', req.EquipmentName || '-');
      setTextVal('pmTcTargetDate', req.InformDate || req.TargetDate || '-');
      setTextVal('pmTcModelKey', modelKey + ' (Check ' + cleanLvl + ')');

      const checkBadge = document.getElementById('pmTcCheckBadge');
      if (checkBadge) checkBadge.textContent = 'CHECK ' + cleanLvl;

      const reqStatus = (req.Status || 'รอดำเนินการ').toString().trim();
      const statusBadge = document.getElementById('pmTcStatusBadge');
      if (statusBadge) {
        statusBadge.textContent = reqStatus;
        statusBadge.className = 'status-badge ' + getStatusClass(reqStatus);
      }
    } catch(errH) {
      console.error('Error populating PM header:', errH);
    }

    // 2. Parse PM Checklist Data
    let pmData = {};
    const rawJson = req.PmChecklistData || req.MaintenanceDetails;
    if (rawJson) {
      if (typeof rawJson === 'object') {
        pmData = rawJson;
      } else if (typeof rawJson === 'string' && rawJson.trim().indexOf('{') === 0) {
        try { pmData = JSON.parse(rawJson); } catch(e) {}
      }
    }

    // 3. Hr/Meter & Date
    try {
      const hrEl = document.getElementById('pmTcHrKm');
      if (hrEl) hrEl.value = pmData.hrMeter || pmData.hrKm || req.HrKm || '';

      const now = new Date();
      const todayDmy = formatDateDMY(now);
      const techDateEl = document.getElementById('pmTcTechDate');
      if (techDateEl) techDateEl.value = pmData.completeDate || req.CompleteDate || todayDmy;
    } catch(errHr) {
      console.error('Error populating PM Hr/Date:', errHr);
    }

    // 4. Section B (Tools)
    try {
      renderPmToolRows(pmData.sectionB || []);
    } catch(errB) {
      console.error('Error in renderPmToolRows:', errB);
    }

    // 5. Section C (Consumables)
    try {
      renderPmConsumableRows(pmData.sectionC || []);
    } catch(errC) {
      console.error('Error in renderPmConsumableRows:', errC);
    }

    // 6. Section D (Checklist)
    try {
      renderPmChecklist(modelKey, cleanLvl, pmData.checklist || []);
    } catch(errChk) {
      console.error('Error in renderPmChecklist:', errChk);
    }

    // 7. Section E (Defect Found & Rectification)
    try {
      const defectFound = (pmData.defectFound || 'NO').toString().toUpperCase().trim();
      const radioYes = document.getElementById('pmDefectRadioYes');
      const radioNo = document.getElementById('pmDefectRadioNo');
      if (defectFound === 'YES' && radioYes) radioYes.checked = true;
      else if (radioNo) radioNo.checked = true;

      const rectEl = document.getElementById('pmTcRectification');
      if (rectEl) rectEl.value = pmData.rectification || '';
      handlePmDefectRadioChange();
    } catch(errDef) {
      console.error('Error in defect section:', errDef);
    }

    // 8. Materials Table
    try {
      renderPmMaterialRows(pmData.materials || []);
    } catch(errMat) {
      console.error('Error in renderPmMaterialRows:', errMat);
    }

    // 9. Section F (Technicians)
    try {
      populatePmTechnicianSelects(req, pmData);
    } catch(errTech) {
      console.error('Error in populatePmTechnicianSelects:', errTech);
    }

    // 10. Dual Signatures (Supervisor & Manager)
    try {
      populatePmDualSignatures(req, pmData);
    } catch(errSig) {
      console.error('Error in populatePmDualSignatures:', errSig);
    }

    // 11. Action Buttons
    try {
      configurePmActionButtons(req);
    } catch(errBtn) {
      console.error('Error in configurePmActionButtons:', errBtn);
    }

  } catch(errMain) {
    console.error('Fatal error in openPmTaskCard:', errMain);
    showToast('เกิดข้อผิดพลาดในการเปิด Task Card: ' + errMain.message, 'error');
  }
}

// === SECTION D: CHECKLIST CONTROLLERS ===
function renderPmChecklist(modelKey, checkLvl, savedChecks) {
  const container = document.getElementById('pmTcChecklistContainer');
  if (!container) return;
  container.innerHTML = '';

  const cleanLvl = normalizePmCheckLevel(checkLvl);
  const allItems = [];

  // 1. ตรวจสอบจาก PM_TASK_CARD_TEMPLATES ก่อนเป็นลำดับแรก (มีรายละเอียดครบถ้วนทั้ง 36 รุ่น)
  if (typeof PM_TASK_CARD_TEMPLATES !== 'undefined' && PM_TASK_CARD_TEMPLATES[modelKey]) {
    const tpl = PM_TASK_CARD_TEMPLATES[modelKey];
    const chk = (tpl.checks && (tpl.checks[cleanLvl] || tpl.checks['A'] || Object.values(tpl.checks)[0])) || null;
    if (chk && chk.items && chk.items.length > 0) {
      chk.items.forEach(function(item) {
        allItems.push({
          no: item.no,
          desc: item.desc || item.text || ''
        });
      });
    }
  }

  // 2. หากยังไม่พบ ให้ดึงจาก PM_LAYOUT_DB
  if (allItems.length === 0) {
    const tplKey = resolvePmTemplateKey(modelKey, cleanLvl);
    const layoutPages = (typeof PM_LAYOUT_DB !== 'undefined' && (PM_LAYOUT_DB[tplKey] || PM_LAYOUT_DB['TR-TLD-025-A-TLM'])) || null;
    if (layoutPages) {
      layoutPages.forEach(function(p) {
        if (p.checklistItems && p.checklistItems.length > 0) {
          p.checklistItems.forEach(function(item) {
            allItems.push({
              no: item.itemNo,
              desc: item.text || ('Check item ' + item.itemNo)
            });
          });
        }
      });
    }
  }

  // 3. Fallback: รายการตรวจเช็คมาตรฐาน GSE 250-Hour Inspection เพื่อไม่ให้ช่องว่างเปล่าเด็ดขาด
  if (allItems.length === 0) {
    const standardItems = [
      { no: 1, desc: "250 HOURS GENERAL INSPECTION" },
      { no: 2, desc: "1. Check engine oil level and replenish if necessary" },
      { no: 3, desc: "2. Check coolant level and inspect radiator hoses" },
      { no: 4, desc: "3. Check battery terminals and cable connectors" },
      { no: 5, desc: "4. Check fan belts and alternator belt tension" },
      { no: 6, desc: "5. Check air filter condition, clean or replace if needed" },
      { no: 7, desc: "6. Check hydraulic fluid level and inspect for leaks" },
      { no: 8, desc: "7. Check brake fluid level and brake operation" },
      { no: 9, desc: "8. Check steering system and grease linkage joints" },
      { no: 10, desc: "9. Check tire condition and inflation pressure" },
      { no: 11, desc: "10. Check all lighting (headlights, beacon, turn lamps)" },
      { no: 12, desc: "11. Inspect tow bar / hitch mechanism for wear" },
      { no: 13, desc: "12. Check fire extinguisher validity and mounting" },
      { no: 14, desc: "13. Drain water / sediment from fuel filter" },
      { no: 15, desc: "14. General greasing and lubrication of all nipples" }
    ];
    standardItems.forEach(function(it) { allItems.push(it); });
  }

  currentPmChecklistItems = allItems;
  const counterEl = document.getElementById('pmTcChecklistCounter');
  if (counterEl) counterEl.textContent = '(' + allItems.length + ' รายการย่อย)';

  const savedMap = {};
  if (savedChecks && Array.isArray(savedChecks)) {
    savedChecks.forEach(function(c) {
      if (typeof c === 'number') savedMap[c] = true;
      else if (c && c.no) savedMap[c.no] = (c.checked === true || c.status === 'PASS');
    });
  }

  let html = '';
  allItems.forEach(function(item) {
    const isChecked = savedMap[item.no] !== undefined ? savedMap[item.no] : true; // Default checked per user preference
    const descText = (item.desc || '').trim();
    const isBoldHeader = !descText ||
      /^\d+\s*HOURS/i.test(descText) ||
      /^[A-Z0-9\s\(\)&/\-]+$/.test(descText) && !/^\d+\.\s*/.test(descText);

    if (isBoldHeader) {
      html += '<div class="pm-chk-group-header"><i class="fas fa-folder-open"></i> ' + escapeHtml(descText) + '</div>';
    } else {
      const cleanDesc = descText.replace(/^\d+\.\s*/, '');
      html += '<label class="pm-chk-item-row" for="chkItem_' + item.no + '">' +
        '<input type="checkbox" id="chkItem_' + item.no + '" class="pm-chk-box" data-no="' + item.no + '" ' + (isChecked ? 'checked' : '') + '>' +
        '<span style="flex:1;"><b>' + item.no + '.</b> ' + escapeHtml(cleanDesc || descText) + '</span>' +
        '</label>';
    }
  });

  container.innerHTML = html;
}

function updatePmReportedByNames() {
  const sel1 = document.getElementById('pmTcActionBy1');
  const sel2 = document.getElementById('pmTcActionBy2');
  const sel3 = document.getElementById('pmTcActionBy3');
  const preview = document.getElementById('pmTcReportedByPreview');
  if (!sel1 || !preview) return;

  const techList = (typeof techniciansListCache !== 'undefined' && techniciansListCache) ? techniciansListCache : [];
  const getFullName = function(id) {
    if (!id) return '';
    const match = techList.find(function(t) { return t.employeeId === id; });
    if (match) return match.employeeId + ' ' + match.fullName;
    if (currentUser && currentUser.employeeId === id) return currentUser.employeeId + ' ' + (currentUser.fullName || id);
    return id;
  };

  const names = [];
  if (sel1.value) names.push(getFullName(sel1.value));
  if (sel2 && sel2.value && sel2.value !== sel1.value) names.push(getFullName(sel2.value));
  if (sel3 && sel3.value && sel3.value !== sel1.value && sel3.value !== (sel2 ? sel2.value : '')) names.push(getFullName(sel3.value));

  preview.textContent = names.join('\n');
}

// === SUBMIT & APPROVAL HANDLERS ===
function handlePmTechnicianSubmit() {
  if (!currentActivePmRequest) return;
  const sel1 = document.getElementById('pmTcActionBy1');
  const act1 = sel1 ? sel1.value : '';
  const act2 = document.getElementById('pmTcActionBy2') ? document.getElementById('pmTcActionBy2').value : '';
  const act3 = document.getElementById('pmTcActionBy3') ? document.getElementById('pmTcActionBy3').value : '';

  if (!act1) {
    showToast('กรุณาระบุช่างผู้ปฏิบัติงานหลัก (Action By 1)', 'error');
    return;
  }

  const isDefectYes = document.getElementById('pmDefectRadioYes').checked;
  const rectification = document.getElementById('pmTcRectification').value.trim();

  // บังคับระบุ Rectification เมื่อติ๊ก YES
  if (isDefectYes && !rectification) {
    showToast('คำเตือน: คุณระบุว่าพบ Defect กรุณาระบุรายละเอียดการแก้ไข (Rectification Actions)', 'error');
    document.getElementById('pmTcRectification').focus();
    return;
  }

  // รวบรวม Section B
  const sectionB = [];
  document.querySelectorAll('#pmTcToolsTbody .pm-tool-row').forEach(function(tr) {
    const ref = tr.querySelector('.pm-tool-ref').value.trim();
    const desc = tr.querySelector('.pm-tool-desc').value.trim();
    if (ref || desc) sectionB.push({ ref: ref, desc: desc });
  });

  // รวบรวม Section C
  const sectionC = [];
  document.querySelectorAll('#pmTcConsumablesTbody .pm-cons-row').forEach(function(tr) {
    const desc = tr.querySelector('.pm-cons-desc').value.trim();
    const spec = tr.querySelector('.pm-cons-spec').value.trim();
    if (desc || spec) sectionC.push({ desc: desc, spec: spec });
  });

  // รวบรวม Checklist
  const checklist = [];
  document.querySelectorAll('.pm-chk-box').forEach(function(box) {
    checklist.push({
      no: parseInt(box.getAttribute('data-no')),
      checked: box.checked
    });
  });

  // รวบรวม Materials
  const materials = [];
  document.querySelectorAll('#pmTcMaterialsTbody .pm-mat-row').forEach(function(tr, idx) {
    const desc = tr.querySelector('.pm-mat-desc').value.trim();
    const partNo = tr.querySelector('.pm-mat-partno').value.trim();
    const qty = parseInt(tr.querySelector('.pm-mat-qty').value) || 1;
    const snBatch = tr.querySelector('.pm-mat-snbatch').value.trim();
    if (desc || partNo) materials.push({ no: idx + 1, desc: desc, partNo: partNo, qty: qty, snBatch: snBatch });
  });

  const reportedBy = document.getElementById('pmTcReportedByPreview').textContent.trim();

  showLoading();
  const pmReport = {
    actionBy1: act1,
    actionBy2: act2,
    actionBy3: act3,
    hrKm: document.getElementById('pmTcHrKm').value.trim(),
    hrMeter: document.getElementById('pmTcHrKm').value.trim(),
    serialNo: document.getElementById('pmTcSerNo').value.trim(),
    sectionB: sectionB,
    sectionC: sectionC,
    checklist: checklist,
    defectFound: isDefectYes ? 'YES' : 'NO',
    rectification: rectification,
    materials: materials,
    reportedBy: reportedBy
  };

  const userEmpId = currentUser ? currentUser.employeeId : '';

  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res && res.success) {
        showToast(res.message || 'บันทึกรายงาน Task Card สำเร็จ', 'success');
        if (res.reportData) {
          currentActivePmRequest.PmChecklistData = JSON.stringify(res.reportData);
          currentActivePmRequest.Status = res.status || 'รอ Supervisor ตรวจสอบ';
          recomputeAndUpdateCounts();
          filterPmTable();
        }
        closePmTaskCardModal();
      } else {
        showToast((res && res.message) ? res.message : 'เกิดข้อผิดพลาดในการบันทึก', 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('เกิดข้อผิดพลาด: ' + (err.message || err), 'error');
    })
    .submitPmTaskCardReport(currentActivePmRequest.UUID, pmReport, userEmpId);
}

function handlePmSupervisorApprove() {
  if (!currentActivePmRequest) return;
  const userEmpId = currentUser ? currentUser.employeeId : '';

  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {

// Global in-memory cache for loaded PM template pages
window._pmTemplatePagesCache = window._pmTemplatePagesCache || {};

/**
 * prefetchPmTemplates: โหลดล่วงหน้าในเบื้องหลังอย่างนุ่มนวล
 */
function prefetchPmTemplates() {
  const k = 'TR-TLD-025-A-TLM';
  if (!window._pmTemplatePagesCache[k]) {
    try {
      const sess = sessionStorage.getItem('cached_pm_tpl_' + k);
      if (sess) {
        const parsed = JSON.parse(sess);
        if (Array.isArray(parsed) && parsed.length > 0) {
          window._pmTemplatePagesCache[k] = parsed;
          return;
        }
      }
    } catch(e) {}
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(pages) {
          if (pages && pages.length) {
            window._pmTemplatePagesCache[k] = pages;
            try { sessionStorage.setItem('cached_pm_tpl_' + k, JSON.stringify(pages)); } catch(e2) {}
          }
        })
        .withFailureHandler(function(err) {
          console.warn('Prefetch PM template warning:', err);
        })
        .getPmTemplatePages(k);
    }
  }
}

/**
 * updatePmPrintPageBackgrounds: อัปเดตรูปภาพพื้นหลังเมื่อโหลดเสร็จในเบื้องหลัง
 */
function updatePmPrintPageBackgrounds(pagesB64) {
  if (!pagesB64 || !pagesB64.length) return;
  for (let i = 0; i < pagesB64.length; i++) {
    const bgImg = document.getElementById('pmPageBg_' + (i + 1));
    if (bgImg && pagesB64[i]) {
      bgImg.src = pagesB64[i];
      bgImg.style.display = 'block';
    }
  }
}

/**
 * showPmPrintPreview: สร้างเอกสาร A4 หลายหน้าครบถ้วน ไม่มีหน้าขาว 100%
 */
function showPmPrintPreview(arg1, arg2, arg3) {
  try {
    let req = null;
    if (typeof arg1 === 'object' && arg1 !== null) {
      req = arg1;
    }
    const idx1 = (typeof arg1 === 'number') ? arg1 : (typeof arg1 === 'string' && /^\d+$/.test(arg1.trim()) ? parseInt(arg1.trim(), 10) : NaN);
    const idx3 = (typeof arg3 === 'number') ? arg3 : (typeof arg3 === 'string' && /^\d+$/.test(arg3.trim()) ? parseInt(arg3.trim(), 10) : NaN);
    if (!req && !isNaN(idx1) && window._pmRequestsList && window._pmRequestsList[idx1]) {
      req = window._pmRequestsList[idx1];
    } else if (!req && !isNaN(idx3) && window._pmRequestsList && window._pmRequestsList[idx3]) {
      req = window._pmRequestsList[idx3];
    }

    const id1 = (arg1 != null && typeof arg1 !== 'object') ? arg1.toString().trim() : '';
    const id2 = (arg2 != null && typeof arg2 !== 'object') ? arg2.toString().trim() : '';

    if (!req && window._pmRequestsMap) {
      req = (id1 && window._pmRequestsMap[id1]) || (id2 && window._pmRequestsMap[id2]);
    }
    if (!req && allRequests) {
      req = allRequests.find(function(r) {
        const u = (r.UUID || '').toString().trim();
        const rid = (r.RequestID || '').toString().trim();
        const wo = (r.WorkOrderNo || '').toString().trim();
        return (id1 && (u === id1 || rid === id1 || wo === id1)) ||
               (id2 && (u === id2 || rid === id2 || wo === id2));
      });
    }
    if (!req) {
      showToast('ไม่พบข้อมูลรายการ PM ในระบบ', 'error');
      return;
    }

    const checkLvl = req.PmCheckLevel || req.DamageAppearance || 'A';
    const cleanLvl = normalizePmCheckLevel(checkLvl);
    const modelKey = resolvePmModelKey(req.EquipmentCode, req.EquipmentName);
    let tplKey = resolvePmTemplateKey(modelKey, cleanLvl);

    // Fallback template key based on equipment type
    if (tplKey.indexOf('GP') !== -1) {
      tplKey = 'GP-MAK-090-A-TLM';
    } else if (tplKey.indexOf('CAM') !== -1) {
      tplKey = 'TR-CAM-804-A-TLM';
    } else {
      tplKey = 'TR-TLD-025-A-TLM';
    }

    // 1. ตรวจสอบ Cache ในหน่วยความจำก่อน
    let cachedPages = (window._pmTemplatePagesCache && window._pmTemplatePagesCache[tplKey]) || null;

    // 2. ตรวจสอบ sessionStorage
    if (!cachedPages) {
      try {
        const sessData = sessionStorage.getItem('cached_pm_tpl_' + tplKey);
        if (sessData) {
          const parsed = JSON.parse(sessData);
          if (Array.isArray(parsed) && parsed.length > 0) {
            cachedPages = parsed;
            window._pmTemplatePagesCache[tplKey] = parsed;
          }
        }
      } catch(eSession) {}
    }

    // 3. หากมีแคชแล้ว เรนเดอร์เอกสารและเปิดหน้าทันที 0ms (ไม่มีหน้าขาว)
    if (cachedPages && cachedPages.length > 0) {
      renderPmPrintPages(req, tplKey, cachedPages);
      return;
    }

    // 4. หากยังไม่มีในแคช ให้แสดงสถานะโหลดก่อน แล้วดึงภาพแม่แบบจาก Server เพื่อเปิดพร้อมภาพ
    showLoading();
    const loadingText = document.querySelector('#loadingOverlay .loading-spinner p');
    const oldLoadingText = loadingText ? loadingText.textContent : 'กำลังโหลด...';
    if (loadingText) loadingText.textContent = 'กำลังเตรียมแบบฟอร์มเอกสาร PM A4...';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(pages) {
          hideLoading();
          if (loadingText) loadingText.textContent = oldLoadingText;
          if (pages && pages.length) {
            window._pmTemplatePagesCache[tplKey] = pages;
            try { sessionStorage.setItem('cached_pm_tpl_' + tplKey, JSON.stringify(pages)); } catch(eStorage) {}
            renderPmPrintPages(req, tplKey, pages);
          } else {
            renderPmPrintPages(req, tplKey, null);
          }
        })
        .withFailureHandler(function(err) {
          hideLoading();
          if (loadingText) loadingText.textContent = oldLoadingText;
          console.warn('Load of PM template pages failed:', err);
          renderPmPrintPages(req, tplKey, null);
        })
        .getPmTemplatePages(tplKey);
    } else {
      hideLoading();
      if (loadingText) loadingText.textContent = oldLoadingText;
      renderPmPrintPages(req, tplKey, null);
    }

  } catch(errPrint) {
    console.error('Fatal error in showPmPrintPreview:', errPrint);
    showToast('เกิดข้อผิดพลาดในการเปิดหน้าพิมพ์: ' + errPrint.message, 'error');
  }
}

/**
 * renderPmPrintPages: เรนเดอร์หน้ากระดาษ A4 และ Overlay ข้อมูลลงบนหน้าพิมพ์ (0ms ทันที ไม่ขาว)
 */
function renderPmPrintPages(req, tplKey, pagesB64) {
  try {
    const layoutPages = (typeof PM_LAYOUT_DB !== 'undefined' && PM_LAYOUT_DB[tplKey]) ? PM_LAYOUT_DB[tplKey] : [];
    const numPages = (pagesB64 && pagesB64.length > 0) ? pagesB64.length : ((layoutPages && layoutPages.length > 0) ? layoutPages.length : (tplKey.indexOf('GP') !== -1 ? 3 : 5));

    let pmData = {};
    const rawJson = req.PmChecklistData || req.MaintenanceDetails;
    if (rawJson) {
      if (typeof rawJson === 'object') {
        pmData = rawJson;
      } else if (typeof rawJson === 'string' && rawJson.trim().indexOf('{') === 0) {
        try { pmData = JSON.parse(rawJson); } catch(e) {}
      }
    }

  let serNo = req.SerialNo || pmData.serialNo || '';
  if (!serNo) serNo = getSerNoFromMaster(req.EquipmentCode);

  const hrMeterVal = pmData.hrMeter || pmData.hrKm || req.HrKm || '';
  const woNoVal = req.WorkOrderNo || '';
  const techDateVal = pmData.completeDate || req.CompleteDate || req.InformDate || '';

  // Reported By names list
  const reportedByVal = (pmData.reportedBy || req.TechnicianName || req.ActionBy1 || '').toString().trim();

  // Verified By (Supervisor on top, Manager below)
  let verifiedByVal = pmData.verifiedBy || '';
  if (!verifiedByVal) {
    const supN = req.SupervisorName || '';
    const mgrN = req.ManagerName || '';
    if (supN && mgrN) verifiedByVal = supN + '\n' + mgrN;
    else if (supN) verifiedByVal = supN;
    else if (mgrN) verifiedByVal = mgrN;
  }
  const verifiedDateVal = pmData.verifiedDate || req.ManagerDate || req.SupervisorDate || '';

  const container = document.getElementById('pmPrintPagesContainer');
  if (!container) return;
  container.innerHTML = '';

  // Saved check status map
  const checkedMap = {};
  if (pmData.checklist && Array.isArray(pmData.checklist)) {
    pmData.checklist.forEach(function(c) {
      if (typeof c === 'number') checkedMap[c] = true;
      else if (c && c.no) checkedMap[c.no] = (c.checked === true);
    });
  } else {
    // Default all checked
    for (let i = 1; i <= 60; i++) checkedMap[i] = true;
  }

  // Iterate each page
  for (let pIdx = 0; pIdx < numPages; pIdx++) {
    const pageNum = pIdx + 1;
    const pageDiv = document.createElement('div');
    pageDiv.className = 'pm-print-page';
    pageDiv.id = 'pmPage_' + pageNum;

    // Background Image
    const bgImg = document.createElement('img');
    bgImg.className = 'pm-print-page-bg';
    bgImg.id = 'pmPageBg_' + pageNum;
    if (pagesB64 && pagesB64[pIdx]) {
      bgImg.src = pagesB64[pIdx];
      bgImg.style.display = 'block';
    } else {
      bgImg.style.display = 'none';
    }
    pageDiv.appendChild(bgImg);

    // Overlay Container
    const overlay = document.createElement('div');
    overlay.className = 'pm-print-overlay';

    // === PAGE 1 OVERLAYS ===
    if (pageNum === 1) {
      // Header Fields
      overlay.innerHTML += '<div class="pm-print-field" style="left:7.4%; top:10.7%; font-weight:700;">' + escapeHtml(req.EquipmentCode || '') + '</div>';
      overlay.innerHTML += '<div class="pm-print-field" style="left:7.6%; top:15.3%; font-weight:600;">N/A</div>';
      overlay.innerHTML += '<div class="pm-print-field" style="left:18.4%; top:15.3%; font-weight:600;">N/A</div>';
      overlay.innerHTML += '<div class="pm-print-field" style="left:7.4%; top:20.0%; font-weight:700;">' + escapeHtml(serNo || '') + '</div>';
      overlay.innerHTML += '<div class="pm-print-field" style="left:22.1%; top:19.7%; font-weight:700;">' + escapeHtml(hrMeterVal || '') + '</div>';
      overlay.innerHTML += '<div class="pm-print-field" style="left:82.3%; top:15.3%; font-weight:700;">' + escapeHtml(woNoVal || '') + '</div>';

      // Section B: Tools (y = 368, 391, 414 pt)
      const tools = pmData.sectionB || [
        { ref: 'กล่องเครื่องมือ', desc: 'ชุดเครื่องมือช่างประจำตัว' },
        { ref: 'ตัวขันกรองเครื่อง', desc: 'ประแจขันกรองน้ำมันเครื่อง' }
      ];
      const yToolsPct = [43.7, 46.4, 49.2];
      tools.slice(0, 3).forEach(function(t, idx) {
        const topP = yToolsPct[idx];
        overlay.innerHTML += '<div class="pm-print-field" style="left:7.6%; top:' + topP + '%;">' + escapeHtml(t.ref || t.reference || '') + '</div>';
        overlay.innerHTML += '<div class="pm-print-field" style="left:35.3%; top:' + topP + '%;">' + escapeHtml(t.desc || t.description || '') + '</div>';
      });

      // Section C: Consumables (y = 490, 510, 530, 550 pt)
      const cons = pmData.sectionC || [
        { desc: 'กรองน้ำมันเครื่อง', spec: 'KL094' },
        { desc: 'กรองโซล่า', spec: 'KF267' }
      ];
      const yConsPct = [58.2, 60.6, 63.0, 65.3];
      cons.slice(0, 4).forEach(function(c, idx) {
        const topP = yConsPct[idx];
        overlay.innerHTML += '<div class="pm-print-field" style="left:7.6%; top:' + topP + '%;">' + escapeHtml(c.desc || c.description || '') + '</div>';
        overlay.innerHTML += '<div class="pm-print-field" style="left:50.4%; top:' + topP + '%;">' + escapeHtml(c.spec || c.specification || '') + '</div>';
      });

      // Signatures Page 1
      overlay.innerHTML += '<div class="pm-print-field" style="left:7.6%; top:86.1%;">' + escapeHtml(techDateVal || '') + '</div>';
      overlay.innerHTML += '<div class="pm-print-field" style="left:21.0%; top:86.1%; line-height:1.35; white-space:pre-line;">' + escapeHtml(reportedByVal || '') + '</div>';
      if (verifiedDateVal) overlay.innerHTML += '<div class="pm-print-field" style="left:52.9%; top:86.1%;">' + escapeHtml(verifiedDateVal || '') + '</div>';
      if (verifiedByVal) overlay.innerHTML += '<div class="pm-print-field" style="left:66.4%; top:86.1%; line-height:1.35; white-space:pre-line;">' + escapeHtml(verifiedByVal || '') + '</div>';
    }

    // === CHECKLIST PAGES (Pages 2 to numPages - 1) ===
    if (pageNum > 1 && pageNum < numPages) {
      // Find layout for this page
      const pLayout = layoutPages.find(function(lp) { return lp.page === pageNum; });
      if (pLayout && pLayout.checklistItems) {
        pLayout.checklistItems.forEach(function(it) {
          if (checkedMap[it.itemNo] !== false) {
            const topPct = (it.y / 841.89) * 100;
            if (typeof PM_CHECK_ICON_B64 !== 'undefined') {
              overlay.innerHTML += '<img src="' + PM_CHECK_ICON_B64 + '" class="pm-print-check-icon" style="left:83.8%; top:' + topPct + '%;">';
            } else {
              overlay.innerHTML += '<div class="pm-print-field" style="left:83.8%; top:' + topPct + '%; font-weight:700; transform:translate(-50%,-50%);">✓</div>';
            }
          }
        });
      }
    }

    // === FINAL PAGE OVERLAYS ===
    if (pageNum === numPages) {
      const isDefectYes = (pmData.defectFound || 'NO').toString().toUpperCase().trim() === 'YES';
      if (typeof PM_CHECK_ICON_B64 !== 'undefined') {
        if (isDefectYes) {
          overlay.innerHTML += '<img src="' + PM_CHECK_ICON_B64 + '" class="pm-print-check-icon" style="left:19.1%; top:15.1%;">';
        } else {
          overlay.innerHTML += '<img src="' + PM_CHECK_ICON_B64 + '" class="pm-print-check-icon" style="left:32.6%; top:15.1%;">';
        }
      }

      // Rectification text on 3 dotted lines (y = 177, 200, 223 pt)
      const rectText = (pmData.rectification || '').toString().trim();
      if (rectText) {
        const line1 = rectText.substring(0, 65);
        const line2 = rectText.substring(65, 130);
        const line3 = rectText.substring(130, 195);
        if (line1) overlay.innerHTML += '<div class="pm-print-field" style="left:7.5%; top:21.0%;">' + escapeHtml(line1) + '</div>';
        if (line2) overlay.innerHTML += '<div class="pm-print-field" style="left:7.5%; top:23.7%;">' + escapeHtml(line2) + '</div>';
        if (line3) overlay.innerHTML += '<div class="pm-print-field" style="left:7.5%; top:26.5%;">' + escapeHtml(line3) + '</div>';
      }

      // Materials Table rows (y = 339, 365, 390, 416, 442 pt)
      const mats = pmData.materials || [];
      const yMatsPct = [40.3, 43.4, 46.3, 49.4, 52.5];
      mats.slice(0, 5).forEach(function(m, idx) {
        const topP = yMatsPct[idx];
        overlay.innerHTML += '<div class="pm-print-field" style="left:3.7%; top:' + topP + '%; text-align:center;">' + (m.no || (idx + 1)) + '</div>';
        overlay.innerHTML += '<div class="pm-print-field" style="left:7.5%; top:' + topP + '%;">' + escapeHtml(m.desc || m.name || '') + '</div>';
        overlay.innerHTML += '<div class="pm-print-field" style="left:33.6%; top:' + topP + '%;">' + escapeHtml(m.partNo || '') + '</div>';
        overlay.innerHTML += '<div class="pm-print-field" style="left:58.8%; top:' + topP + '%; text-align:center;">' + (m.qty || 1) + '</div>';
        overlay.innerHTML += '<div class="pm-print-field" style="left:68.9%; top:' + topP + '%;">' + escapeHtml(m.snBatch || m.typeModel || '') + '</div>';
      });

      // Signatures on Final Page
      overlay.innerHTML += '<div class="pm-print-field" style="left:7.6%; top:86.1%;">' + escapeHtml(techDateVal || '') + '</div>';
      overlay.innerHTML += '<div class="pm-print-field" style="left:21.0%; top:86.1%; line-height:1.35; white-space:pre-line;">' + escapeHtml(reportedByVal || '') + '</div>';
      if (verifiedDateVal) overlay.innerHTML += '<div class="pm-print-field" style="left:52.9%; top:86.1%;">' + escapeHtml(verifiedDateVal || '') + '</div>';
      if (verifiedByVal) overlay.innerHTML += '<div class="pm-print-field" style="left:66.4%; top:86.1%; line-height:1.35; white-space:pre-line;">' + escapeHtml(verifiedByVal || '') + '</div>';
    }

    pageDiv.appendChild(overlay);
    container.appendChild(pageDiv);
  }

    showPage('pmPrintPage');
    window.scrollTo({ top: 0, behavior: 'instant' });
    setTimeout(fitPmPrintToScreen, 50);
    setTimeout(fitPmPrintToScreen, 200);
  } catch(errPrint) {
    console.error('Fatal error in renderPmPrintPages:', errPrint);
    showToast('เกิดข้อผิดพลาดในการเปิดหน้าพิมพ์: ' + errPrint.message, 'error');
  }
}

// === ZOOM CONTROLLERS FOR PM PRINT ===
function setPmPrintScale(scale) {
  pmPrintCurrentScale = Math.min(2.0, Math.max(0.3, scale));
  const scaler = document.getElementById('pmPrintViewportScaler');
  if (scaler) {
    scaler.style.transform = 'scale(' + pmPrintCurrentScale + ')';
    scaler.style.transformOrigin = 'top center';
  }
  const badge = document.getElementById('pmPrintZoomBadge');
  if (badge) badge.textContent = Math.round(pmPrintCurrentScale * 100) + '%';
}

function adjustPmPrintZoom(delta) {
  setPmPrintScale(pmPrintCurrentScale + delta);
}

function resetPmPrintZoom() {
  setPmPrintScale(1.0);
}

function fitPmPrintToScreen() {
  const container = document.getElementById('pmPrintOuterContainer');
  if (!container) return;
  const winW = window.innerWidth || document.documentElement.clientWidth || 390;
  const containerW = container.clientWidth || winW;
  const padding = 16;
  const availW = Math.min(containerW, winW) - padding;
  if (availW <= 0) return;
  const targetScale = Math.min(1.0, availW / PM_PRINT_BASE_W);
  setPmPrintScale(Math.max(0.3, targetScale));
}
