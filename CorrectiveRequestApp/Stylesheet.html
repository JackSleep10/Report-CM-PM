<style>
* {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
}
:root {
 --primary: #E31837;
 --primary-dark: #B91430;
 --primary-deep: #991B1B;
 --primary-light: #FEF2F2;
 --primary-border: #FECACA;

 --surface-ground: #F1F5F9;
 --surface-subtle: #F8FAFC;
 --ink: #0F172A;
 --ink-secondary: #334155;
 --ink-muted: #475569;
 --placeholder: #55657A;
 --border: #CBD5E1;
 --border-subtle: #E2E8F0;
 --info: #0369A1;
 --info-ink: #075985;
 --info-bg: #E0F2FE;
 --info-border: #BAE6FD;
 --accent: #1D4ED8;
 --accent-ink: #1E40AF;
 --accent-bg: #EFF6FF;
 --accent-border: #BFDBFE;
 --supervisor: #0F766E;
 --supervisor-ink: #115E59;
 --supervisor-bg: #CCFBF1;
 --supervisor-border: #99F6E4;
 --manager: #1E3A8A;
 --manager-bg: #DBEAFE;
 --manager-border: #93C5FD;
 --success: #15803D;
 --success-dark: #166534;
 --success-bg: #DCFCE7;
 --success-border: #BBF7D0;
 --warning-solid: #B45309;
 --warning-ink: #92400E;
 --warning-bg: #FEF3C7;
 --warning-border: #FDE68A;
 --danger: #B91C1C;
 --danger-dark: #991B1B;
 --danger-bg: #FEE2E2;
 --danger-border: #FCA5A5;
 --line-green: #007A33;
 --line-green-dark: #006128;
 --focus-ring: #1D4ED8;
 --warning: #B45309;
 --dark: var(--ink);
 --gray: var(--ink-muted);
 --gray-light: var(--border-subtle);
 --gray-lighter: var(--surface-ground);
 --white: var(--surface);
 --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
 --shadow-lg: 0 10px 25px rgba(15, 23, 42, 0.14);
 --radius-sm: 6px;
 --radius: 8px;
 --radius-lg: 12px;
 --z-nav: 100;
 --z-dropdown: 500;
 --z-modal: 1000;
 --z-modal-high: 1050;
 --z-toast: 1100;
 --z-loading: 1200;
}
html {
 max-width: 100%;
 overflow-x: clip;
}
body {
 font-family: 'Sarabun', sans-serif;
 background-color: var(--surface-ground);
 color: var(--ink);
 line-height: 1.55;
 min-height: 100vh;
 overflow-x: clip;
}
body.modal-open {
 overflow: hidden;
}
:focus-visible {
 outline: 2.5px solid var(--focus-ring);
 outline-offset: 2px;
}
:focus:not(:focus-visible) {
 outline: none;
}
.sr-only {
 position: absolute;
 width: 1px;
 height: 1px;
 padding: 0;
 margin: -1px;
 overflow: hidden;
 clip: rect(0, 0, 0, 0);
 white-space: nowrap;
 border: 0;
}
.page { display: none; }
.page.active { display: block; }
.loading-overlay {
 position: fixed;
 top: 0; left: 0;
 width: 100%; height: 100%;
 background: rgba(255,255,255,0.88);
 display: flex;
 align-items: center;
 justify-content: center;
 z-index: var(--z-loading);
}
.loading-spinner {
 text-align: center;
 color: var(--primary);
}
.loading-spinner i {
 font-size: 3rem;
 margin-bottom: 12px;
}
.loading-spinner p {
 font-size: 1.05rem;
 font-weight: 600;
 color: var(--ink-muted);
}
.btn {
 display: inline-flex;
 align-items: center;
 justify-content: center;
 gap: 6px;
 padding: 9px 18px;
 border: 1.5px solid transparent;
 border-radius: var(--radius);
 font-family: 'Sarabun', sans-serif;
 font-size: 0.94rem;
 font-weight: 600;
 cursor: pointer;
 transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
 text-decoration: none;
 line-height: 1.25;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--white); border-color: var(--primary); }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn-secondary { background: var(--surface-subtle); color: var(--ink-secondary); border-color: var(--border); }
.btn-secondary:hover:not(:disabled) { background: var(--border-subtle); color: var(--ink); border-color: var(--ink-muted); }
.btn-accent { background: var(--accent); color: var(--white); border-color: var(--accent); }
.btn-accent:hover:not(:disabled) { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn-success { background: var(--success); color: var(--white); border-color: var(--success); }
.btn-success:hover:not(:disabled) { background: var(--success-dark); border-color: var(--success-dark); }
.btn-warning { background: var(--warning-solid); color: var(--white); border-color: var(--warning-solid); }
.btn-warning:hover:not(:disabled) { background: var(--warning-ink); border-color: var(--warning-ink); }
.btn-info { background: var(--info); color: var(--white); border-color: var(--info); }
.btn-info:hover:not(:disabled) { background: var(--info-ink); border-color: var(--info-ink); }
.btn-danger { background: var(--danger); color: var(--white); border-color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger-dark); border-color: var(--danger-dark); }
.btn-line { background: var(--line-green); color: var(--white); border-color: var(--line-green); }
.btn-line:hover:not(:disabled) { background: var(--line-green-dark); border-color: var(--line-green-dark); }
.btn-navy { background: var(--manager); color: var(--white); border-color: var(--manager); }
.btn-navy:hover:not(:disabled) { background: #172554; border-color: #172554; }
.btn-teal { background: var(--supervisor); color: var(--white); border-color: var(--supervisor); }
.btn-teal:hover:not(:disabled) { background: var(--supervisor-ink); border-color: var(--supervisor-ink); }
.btn-dark { background: var(--ink); color: var(--white); border-color: var(--ink); }
.btn-dark:hover:not(:disabled) { background: var(--ink-secondary); border-color: var(--ink-secondary); }
.btn-outline {
 background: var(--surface);
 color: var(--ink-secondary);
 border: 1.5px solid var(--border);
}
.btn-outline:hover:not(:disabled) {
 background: var(--surface-subtle);
 color: var(--ink);
 border-color: var(--ink-muted);
}
.navbar .btn-outline {
 background: rgba(15, 23, 42, 0.22);
 color: var(--white);
 border: 1.5px solid rgba(255, 255, 255, 0.78);
}
.navbar .btn-outline:hover:not(:disabled) {
 background: rgba(15, 23, 42, 0.36);
 color: var(--white);
 border-color: var(--white);
}
.btn-outline-primary {
 background: var(--surface);
 color: var(--accent-ink);
 border: 1.5px solid var(--accent-border);
}
.btn-outline-primary:hover:not(:disabled) {
 background: var(--accent-bg);
 border-color: var(--accent);
}
.btn-outline-secondary {
 background: var(--surface);
 color: var(--ink-secondary);
 border: 1.5px solid var(--border);
}
.btn-outline-secondary:hover:not(:disabled) {
 background: var(--surface-ground);
 color: var(--ink);
 border-color: var(--ink-muted);
}
.btn-outline-success {
 background: var(--surface);
 color: var(--success-dark);
 border: 1.5px solid var(--success-border);
}
.btn-outline-success:hover:not(:disabled) {
 background: var(--success-bg);
 border-color: var(--success);
}
.btn-outline-danger {
 background: var(--surface);
 color: var(--danger);
 border: 1.5px solid var(--danger-border);
}
.btn-outline-danger:hover:not(:disabled) {
 background: var(--danger);
 color: var(--white);
 border-color: var(--danger);
}
.btn-sm { padding: 6px 12px; font-size: 0.85rem; }
.btn-xs { padding: 4px 10px; font-size: 0.8rem; }
.btn-block { width: 100%; justify-content: center; }
.btn-icon {
 width: 34px; height: 34px;
 padding: 0;
 border-radius: 50%;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 font-size: 0.85rem;
}
.modal-close,
.btn-close-modal {
 width: 36px;
 height: 36px;
 min-width: 36px;
 padding: 0;
 border-radius: var(--radius);
 background: transparent;
 color: var(--ink-muted);
 border: 1px solid transparent;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 font-size: 1.2rem;
 line-height: 1;
 cursor: pointer;
 flex-shrink: 0;
 transition: background-color 0.15s ease, color 0.15s ease;
}
.modal-close:hover,
.btn-close-modal:hover {

 color: var(--ink);
}
.login-container {

 justify-content: center;

}

}

.input-group {

}

.error-message {

.nav-version-btn {

.nav-active-users-badge {

 align-items: center;

.admin-tools-wrap {

}

.card {

 padding: 16px 18px;

 align-items: center;
 gap: 14px;
 box-shadow: var(--shadow);

 transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;

/* === MODAL === */
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(15, 23, 42, 0.52);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 9998;
}

.modal-content {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  max-width: 440px;
  width: 100%;
  text-align: left;
  box-shadow: var(--shadow-lg);
}

#appConfirmModal .modal-content,
#appPromptModal .modal-content,
#resetWorkOrderModal .modal-content {
  text-align: center;
}

#appPromptModal .modal-target-summary,
#resetWorkOrderModal .modal-target-summary {
  text-align: left;
}

.modal-header {
  margin-bottom: 14px;
}

.modal-header i {
  font-size: 2rem;
  margin-bottom: 6px;
}

.modal-header h3 {
  font-size: 1.15rem;
}

.modal-subtitle {
  color: var(--ink-muted);
  font-size: 0.9rem;
  margin-top: 4px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
  flex-wrap: wrap;
}

/* === TOAST === */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--ink);
  color: #FFFFFF;
  padding: 12px 16px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  z-index: 10000;
  font-size: 0.92rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: min(440px, 92vw);
  animation: slideIn 0.25s ease;
}

.toast-close {
  background: transparent;
  border: none;
  color: inherit;
  cursor: pointer;
  font-size: 1.15rem;
  line-height: 1;
  padding: 4px 6px;
  min-width: 28px;
  min-height: 28px;
  opacity: 0.85;
  border-radius: 4px;
}
.toast-close:hover {
  opacity: 1;
  background: rgba(255, 255, 255, 0.16);
}

.toast.toast-success { background: #15803D; color: #FFFFFF; }
.toast.toast-error { background: #B91C1C; color: #FFFFFF; }
.toast.toast-warning { background: #B45309; color: #FFFFFF; }
.toast.toast-info { background: #1E40AF; color: #FFFFFF; }

@keyframes slideIn {
  from { transform: translateY(16px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
